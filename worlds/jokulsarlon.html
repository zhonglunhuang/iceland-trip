<script type="module">
/*
 * ── JÖKULSÁRLÓN · 傑古沙龍冰河湖之夜 ─────────────────────────────────────────
 * Map (top view, −Z = north, 1 unit ≈ 1 m):
 *
 *        mountains ── glacier ice cap ── mountains           z ≈ −300 … −800
 *        ════════ glacier tongue (ice cliff) ════════         z ≈ −196
 *          icebergs · icebergs · icebergs · seals             lagoon (water level 0)
 *   ~~~~~~~~~~~~ lagoon shore  ~~~~~~~~~~~~~~~~~~             z ≈ −3.5
 *        [ black-sand spit · lyme grass · SPAWN (2, 6) ]
 *   ~~~~~~~~~~~~ Diamond Beach (ice on black sand) ~~~~~      z ≈ 27
 *        North Atlantic surf (invisible wall: sneaker waves)
 *
 * The ground is ONE function H(x,z): two terrain meshes (fine near / coarse far)
 * are both built from it, so the traveler's feet always match the sand.
 * Water = three's Reflector with a custom shader (aurora + icebergs mirrored,
 * soft shallows from a baked depth texture, moon glitter, choppier ocean).
 */
import * as THREE from 'three';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { createWorld, helpers } from './engine.js';

const { noise2D, fbm, ridged, rand, lerp, clamp, smoothstep } = helpers;
const smin = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1); return lerp(b, a, h) - k * h * (1 - h); };
const smax = (a, b, k) => -smin(-a, -b, k);
const C = (hex) => new THREE.Color(hex);

/* ═══════════════════════════ 1. Landscape ═══════════════════════════ */
const SPAWN = { x: 2, z: 6 };
const MOON = new THREE.Vector3(0.78, 0.5, 0.38).normalize();     // moon low in the east-south-east
const FOG = 0x0b1c2a;
const NEAR = { x0: -125, x1: 125, z0: -55, z1: 70 };              // fine terrain mesh extent

const shoreL = (x) => -3.5 + 2.4 * Math.sin(x * 0.043 + 0.6) + 2.0 * noise2D(x * 0.021, 3.7);   // lagoon waterline (z)
const shoreO = (x) => 27 + 1.8 * Math.sin(x * 0.027 + 1.3) + 1.1 * noise2D(x * 0.018, 8.2);     // ocean waterline (z)
const glacierZ = (x) => -196 + 16 * Math.sin(x * 0.011 + 0.4) + 9 * noise2D(x * 0.013, 1.9);    // glacier front (z)
const basinW = (z) => -185 + 0.38 * Math.min(z, 0);
const basinE = (z) => 172 - 0.2 * Math.min(z, 0);

/** black-sand spit between lagoon (north) and ocean (south), incl. both sea beds */
function spit(x, z) {
  const dL = z - shoreL(x), dO = shoreO(x) - z;
  const dune = 1.55 + 0.6 * fbm(x * 0.02, z * 0.05, 3) + 0.7 * smoothstep(0.15, 0.75, noise2D(x * 0.033 + 5.1, z * 0.07 - 2.3));
  return smin(smin(dL * 0.12, dO * 0.16, 2.4), dune, 1.4);
}
/** moraine hills that close the lagoon to the east and west */
function side(x, z) {
  const out = Math.max(basinW(z) - x, x - basinE(z));
  const hills = 9 + 13 * (0.5 + 0.5 * fbm(x * 0.006 + 3.3, z * 0.006, 3));
  return lerp(-20, smin(-1.5 + out * 0.17, hills, 8), smoothstep(14, 0, z));
}
/** Breiðamerkurjökull: steep ice cliff at the front, slowly rising ice behind */
function glacier(x, z) {
  const dz = glacierZ(x) - z;
  const surf = 21 + dz * 0.16 + 6 * fbm(x * 0.008, z * 0.008, 3) + 3 * ridged(x * 0.03, z * 0.012, 2);
  return Math.min(surf, dz * 5 - 3);
}
const MASSES = [   // mountain massifs (added on top of glacier / moraines)
  { x: -340, z: -440, A: 112, R: 250, s: 1.3 },
  { x: 350, z: -410, A: 98, R: 240, s: 4.1 },
  { x: -70, z: -610, A: 62, R: 85, s: 7.7 },
  { x: 150, z: -570, A: 52, R: 70, s: 2.9 },
  { x: -520, z: -260, A: 70, R: 200, s: 5.5 },
  { x: 540, z: -250, A: 60, R: 190, s: 8.8 },
];
function mountains(x, z) {
  let m = 0;
  for (let i = 0; i < MASSES.length; i++) {
    const M = MASSES[i], dx = x - M.x, dz = z - M.z, d2 = dx * dx + dz * dz;
    if (d2 >= M.R * M.R) continue;
    const k = 1 - smoothstep(0, M.R, Math.sqrt(d2));
    m += M.A * Math.pow(k, 1.25) * (0.4 + 0.85 * ridged(x * 0.0072 + M.s, z * 0.0072 - M.s, 5));
  }
  return m;
}
/** THE ground height — terrain meshes, player physics and prop placement all use it */
function H(x, z) {
  let h = spit(x, z);
  if (z < 16) h = smax(h, side(x, z), 4);
  if (z < -140) h = Math.max(h, glacier(x, z));
  if (z < -40) h += mountains(x, z);
  return Math.max(h, -7);
}
const nearW = (x, z) => Math.min(smoothstep(NEAR.x1, NEAR.x1 - 15, Math.abs(x)), smoothstep(NEAR.z0, NEAR.z0 + 15, z), smoothstep(NEAR.z1, NEAR.z1 - 15, z));
function farH(x, z) {   // coarse mesh hides itself under the fine one
  const h = H(x, z);
  return (x > NEAR.x0 && x < NEAR.x1 && z > NEAR.z0 && z < NEAR.z1) ? h - 0.15 - 4 * nearW(x, z) : h;
}

const COL = {
  sand: C(0x1f2024), sandDry: C(0x2b2c31), wet: C(0x121316), bed: C(0x0b0d10), pebble: C(0x35342f),
  rock: C(0x2b2e34), rockDark: C(0x17191d), snow: C(0xdfe8f2), ice: C(0xc6dceb), iceBlue: C(0x7fc2e6),
  moraine: C(0x2c2d31), moss: C(0x323f2e), ash: C(0x34373d),
};
const _c = new THREE.Color();
function nearColor(x, y, z) {
  _c.copy(COL.sand).lerp(COL.sandDry, smoothstep(0.8, 2.2, y) * (0.55 + 0.45 * noise2D(x * 0.07, z * 0.07)));
  const dO = shoreO(x) - z;
  _c.lerp(COL.pebble, smoothstep(2.2, 3.4, dO) * (1 - smoothstep(3.6, 5.5, dO)) * 0.55);    // storm-beach berm
  _c.lerp(COL.wet, 1 - smoothstep(-0.05, 0.6, y));
  return _c.lerp(COL.bed, 1 - smoothstep(-1.4, -0.3, y));
}
function moraineColor(x, y, z, sy) {
  _c.copy(COL.moraine).lerp(COL.moss, smoothstep(0.0, 0.6, noise2D(x * 0.013, z * 0.013)) * smoothstep(0.75, 0.95, sy) * 0.75);
  _c.lerp(COL.rockDark, 1 - smoothstep(0.62, 0.86, sy));
  if (y < 0.5) _c.lerp(COL.bed, 0.6);
  return _c;
}
function farColor(x, y, z, sy) {
  if (z > -140 || y < 3) return (y < 2.6 && z > -80) ? nearColor(x, y, z) : moraineColor(x, y, z, sy);
  const m = mountains(x, z);
  if (m > 7) {
    _c.copy(COL.rock).lerp(COL.rockDark, 0.5 + 0.5 * noise2D(x * 0.02, z * 0.02));
    return _c.lerp(COL.snow, smoothstep(0.66, 0.84, sy + 0.12 * noise2D(x * 0.04, z * 0.04)) * smoothstep(35, 80, y));
  }
  if (glacier(x, z) < y - 1.5 - m) return moraineColor(x, y, z, sy);
  _c.copy(COL.ice).lerp(COL.snow, 0.35 + 0.35 * noise2D(x * 0.012, z * 0.012));
  _c.lerp(COL.iceBlue, smoothstep(0.75, 0.95, ridged(x * 0.03, z * 0.012, 2)) * 0.5);
  const sx = x * 0.0105 + 0.7 * noise2D(x * 0.003, z * 0.0024), st = Math.abs(sx - Math.round(sx));
  _c.lerp(COL.ash, (1 - smoothstep(0.018, 0.055, st)) * 0.85);                                // medial moraines
  if (m > 2) _c.lerp(COL.rock, smoothstep(2, 7, m));
  return _c;
}

/* ═══════════════════════════ 2. World ═══════════════════════════ */
const ZONE_L = { x: -6, z: shoreL(-6) + 1.4 };          // 冰河湖
const ZONE_D = { x: 8, z: shoreO(8) - 4.5 };            // 鑽石沙灘
const ZONE_A = { x: -26, z: 11 };                       // 極光 (dune crest)

const w = await createWorld({
  title: '傑古沙龍冰河湖',
  subtitle: 'Jökulsárlón · 冰河湖之夜',
  backHref: '../index.html#worlds',
  timeOfDay: 'night',
  background: FOG,
  fog: { color: FOG, density: 0.0018 },
  sky: { top: 0x01040b, horizon: FOG, glow: 0.22 },
  sun: { color: 0xbdd3ff, intensity: 1.1, dir: [MOON.x, MOON.y, MOON.z] },
  hemi: { sky: 0x4a74ab, ground: 0x0a0d14, intensity: 0.55 },
  exposure: 1.22,
  spawn: { x: SPAWN.x, z: SPAWN.z, yaw: Math.PI },
  boundsRadius: 54, boundsCenter: { x: 0, z: 4 },
  heightAt: H,
  water: { level: 0, slow: 0.5, maxDepth: 0.85 },
  bloom: { strength: 0.8, radius: 0.7, threshold: 0.74 },
  camera: { distance: 8.5, pitch: 0.22, lookUp: 2.2, maxDistance: 18 },
  hints: ['走到湖邊，等海豹探頭', '跳上浮冰看看', '翻過沙丘去鑽石沙灘'],
  info: [
    { at: ZONE_L, radius: 6, title: '冰河湖', img: '../assets/img/jokulsarlon.jpg',
      text: '冰島最深的湖，最深超過 280 公尺。眼前的冰山從布雷達梅庫冰川崩落，有些冰已經上千歲，會在湖裡漂上好幾年，才隨潮水流進大海。' },
    { at: ZONE_D, radius: 6.5, title: '鑽石沙灘', img: '../assets/img/diamond-beach.jpg',
      text: '冰塊從湖口被沖進大西洋，又被海浪打回黑沙灘。透明的冰躺在全黑的火山砂上，月光一照閃閃發亮，像撒了一地鑽石。小心瘋狗浪，別靠海太近！' },
    { at: ZONE_A, radius: 5.5, title: '極光', img: '../assets/img/aurora.jpg',
      text: '綠光來自離地約 100–250 公里高空的氧原子，紫色邊緣則來自氮分子。9 月到隔年 4 月、晴朗無光害的夜晚最有機會。拖曳畫面往上看！' },
  ],
});
const { scene, renderer, camera } = w;
const uTime = { value: 0 };
const PX = { value: 900 };                                   // device px per world unit at distance 1 (points)
const updatePx = () => { PX.value = (innerHeight * renderer.getPixelRatio()) / (2 * Math.tan((camera.fov * Math.PI) / 360)); };
updatePx();

/** Tiny procedural night-sky environment (aurora band + moon) → PMREM, for glossy ice & wet sand. */
function makeEnv() {
  const W = 1024, Hh = 512, r = rand(77);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
  const g = cv.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, Hh);
  sky.addColorStop(0, '#02050c'); sky.addColorStop(0.4, '#081522'); sky.addColorStop(0.495, '#183247');
  sky.addColorStop(0.52, '#0b141c'); sky.addColorStop(1, '#030406');
  g.fillStyle = sky; g.fillRect(0, 0, W, Hh);
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,255,255,${(0.2 + r() * 0.6).toFixed(2)})`; g.fillRect(r() * W, r() * Hh * 0.48, 1, 1); }
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {                               // north is u = 0.25 in three's equirect layout
    const x = (0.25 + (r() + r() - 1) * 0.22) * W, yb = Hh * (0.455 - r() * 0.03), yt = yb - Hh * (0.1 + r() * 0.12);
    const lg = g.createLinearGradient(0, yb, 0, yt);
    lg.addColorStop(0, 'rgba(60,255,150,0)'); lg.addColorStop(0.1, `rgba(60,255,150,${(0.18 + r() * 0.25).toFixed(2)})`);
    lg.addColorStop(0.55, 'rgba(40,220,190,0.12)'); lg.addColorStop(1, 'rgba(170,130,255,0)');
    g.fillStyle = lg; g.fillRect(x, yt, 4 + r() * 16, yb - yt);
  }
  const mx = (Math.atan2(MOON.z, MOON.x) / (Math.PI * 2) + 0.5) * W, my = (0.5 - Math.asin(MOON.y) / Math.PI) * Hh;
  const halo = g.createRadialGradient(mx, my, 0, mx, my, 60);
  halo.addColorStop(0, 'rgba(255,255,255,1)'); halo.addColorStop(0.08, 'rgba(235,242,255,0.95)');
  halo.addColorStop(0.2, 'rgba(160,190,255,0.25)'); halo.addColorStop(1, 'rgba(120,150,220,0)');
  g.fillStyle = halo; g.fillRect(mx - 60, my - 60, 120, 120);
  g.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping; tex.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer);
  const env = pm.fromEquirectangular(tex).texture;
  pm.dispose(); tex.dispose();
  return env;
}
const ENV = makeEnv();

/* ═══════════════════════════ 3. Terrain ═══════════════════════════ */
const nearTerrain = helpers.createTerrain({ width: NEAR.x1 - NEAR.x0, depth: NEAR.z1 - NEAR.z0, center: { x: 0, z: (NEAR.z0 + NEAR.z1) / 2 },
  segments: 200, heightFn: H, colorFn: nearColor, roughness: 0.92, noiseTint: 0.06 });
{ // wet sand sheen near the waterline + sparse twinkling black-sand glitter
  const m = nearTerrain.material;
  m.envMap = ENV; m.envMapIntensity = 0.55;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;')
      .replace('#include <fog_vertex>', '#include <fog_vertex>\nvSW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;\nuniform float uTime;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        float jWet = 1.0 - smoothstep(0.02, 0.75, vSW.y);
        diffuseColor.rgb *= mix(1.0, 0.55, jWet);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.22, jWet);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          vec3 gc = floor(vSW * 18.0);
          float hh = fract(sin(dot(gc, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
          vec3 Vg = normalize(vViewPosition);
          float tw = step(0.995, hh) * pow(0.5 + 0.5 * sin(uTime * 2.0 + hh * 300.0 + dot(Vg, vec3(9.0, 7.0, 11.0))), 10.0);
          totalEmissiveRadiance += vec3(0.7, 0.88, 1.0) * tw * (1.0 - smoothstep(4.0, 24.0, length(vViewPosition))) * step(0.0, vSW.y);
        }`);
  };
  m.customProgramCacheKey = () => 'jok-sand-v1';
}
scene.add(nearTerrain);

const farTerrain = helpers.createTerrain({ width: 1300, depth: 900, center: { x: 0, z: -350 }, segments: 200,
  heightFn: farH, colorFn: farColor, roughness: 0.95, noiseTint: 0.04 });
Object.assign(farTerrain.material, { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 });
scene.add(farTerrain);

/* ═══════════════════════════ 4. Water (mirror lagoon + ocean) ═══════════════════════════ */
const DW = 256, DH = 128, dData = new Uint8Array(DW * DH * 4);   // baked ground height under the near water
for (let j = 0; j < DH; j++) for (let i = 0; i < DW; i++) {
  const x = NEAR.x0 + ((i + 0.5) / DW) * (NEAR.x1 - NEAR.x0), z = NEAR.z0 + ((j + 0.5) / DH) * (NEAR.z1 - NEAR.z0);
  const o = (j * DW + i) * 4;
  dData[o] = Math.round(clamp((H(x, z) + 5) / 6, 0, 1) * 255); dData[o + 3] = 255;
}
const depthTex = new THREE.DataTexture(dData, DW, DH, THREE.RGBAFormat);
depthTex.minFilter = depthTex.magFilter = THREE.LinearFilter; depthTex.needsUpdate = true;

const WaterShader = {
  name: 'JokulsarlonWater',
  uniforms: Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTime: { value: 0 }, uDepthMap: { value: null }, uDepthBox: { value: new THREE.Vector4() },
    uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() },
    uMoonDir: { value: new THREE.Vector3() }, uMoonCol: { value: new THREE.Color() },
  }),
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vUvR; varying vec3 vW;
    #include <fog_pars_vertex>
    void main() {
      vUvR = textureMatrix * vec4(position, 1.0);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D uDepthMap; uniform vec4 uDepthBox;
    uniform float uTime; uniform vec3 uDeep, uShallow, uMoonDir, uMoonCol;
    varying vec4 vUvR; varying vec3 vW;
    #include <fog_pars_fragment>
    float hsh(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hsh(i), hsh(i + vec2(1.0, 0.0)), f.x), mix(hsh(i + vec2(0.0, 1.0)), hsh(i + vec2(1.0, 1.0)), f.x), f.y); }
    float waves(vec2 p, float t, float ocean) {
      float h = sin(dot(p, vec2(0.37, 0.21)) + t * 0.9) * 0.5 + sin(dot(p, vec2(-0.29, 0.43)) * 1.3 + t * 1.1) * 0.35;
      h += (vn(p * 0.9 + vec2(t * 0.25, -t * 0.18)) - 0.5) * 0.9 + (vn(p * 2.7 - vec2(t * 0.4, t * 0.3)) - 0.5) * 0.35;
      h += ocean * (sin(p.y * 0.55 + t * 1.6 + sin(p.x * 0.07) * 1.5) * 0.9 + sin(p.y * 1.3 + p.x * 0.2 + t * 2.3) * 0.3);
      return h;
    }
    void main() {
      float t = uTime;
      vec2 p = vW.xz;
      float ocean = smoothstep(24.0, 42.0, p.y);
      float e = 0.35, amp = mix(0.035, 0.2, ocean);
      float h0 = waves(p, t, ocean), hx = waves(p + vec2(e, 0.0), t, ocean), hz = waves(p + vec2(0.0, e), t, ocean);
      vec3 N = normalize(vec3(-(hx - h0) / e * amp, 1.0, -(hz - h0) / e * amp));
      vec2 duv = (p - uDepthBox.xy) / uDepthBox.zw;
      float depth = 10.0;
      if (duv.x > 0.0 && duv.x < 1.0 && duv.y > 0.0 && duv.y < 1.0) depth = -(texture2D(uDepthMap, duv).r * 6.0 - 5.0);
      vec3 toCam = cameraPosition - vW;
      float dist = length(toCam);
      vec3 V = toCam / dist;
      vec4 uv = vUvR;
      uv.xy += N.xz * mix(0.03, 0.06, ocean) * uv.w / (1.0 + dist * 0.015);
      vec3 refl = texture2DProj(tDiffuse, uv).rgb * color;
      float cosT = clamp(dot(V, N), 0.0, 1.0);
      float fres = 0.04 + 0.96 * pow(1.0 - cosT, 5.0);
      vec3 base = mix(uShallow, uDeep, smoothstep(0.0, 3.0, depth));
      vec3 col = mix(base, refl, mix(0.42, 1.0, fres));
      vec3 R = reflect(-V, N);
      col += uMoonCol * pow(max(dot(R, uMoonDir), 0.0), mix(600.0, 160.0, ocean)) * mix(1.6, 4.0, ocean);
      float line = (1.0 - smoothstep(0.0, 0.07, depth)) * smoothstep(-0.02, 0.01, depth) * (0.6 + 0.4 * vn(p * 3.0 + t * 0.3));

        float v = vUv.y;
        float a = smoothstep(0.0, 0.2, v) * exp(-max(v - 0.2, 0.0) * 3.5);
        float side = pow(sin(clamp(vUv.x, 0.0, 1.0) * 3.14159), 1.6);
        float pulse = 0.85 + 0.15 * sin(uTime * 0.31 + vUv.x * 6.0);
        gl_FragColor = vec4(mix(uCol, uCol2, smoothstep(0.3, 0.9, v)) * a * side * pulse * 0.08, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  });
  const m = new THREE.Mesh(geo, mat); m.renderOrder = -997; m.frustumCulled = false; m.name = 'aurora-glow';
  scene.add(m); return m;
})();
scene.add(helpers.createSteam({   // low mist banks drifting over the far lagoon
  sources: [{ x: -70, z: -150, r: 60 }, { x: 60, z: -160, r: 60 }, { x: 0, z: -105, r: 45 }, { x: -140, z: -120, r: 40 }],
  count: 64, height: 3.5, size: 38, opacity: 0.06, color: 0xa8c8da, speed: 0.25, spread: 5, wind: [0.4, 0.0],
}));
scene.add(helpers.createParticles({ count: 500, area: 50, height: 16, speed: 0.15, size: 0.035, color: 0xd6f3ff,   // diamond dust
  opacity: 0.6, sway: 0.6, blending: 'additive' }));

const auroraLight = new THREE.DirectionalLight(0x6dffc0, 0.32); auroraLight.position.set(-20, 120, -260); scene.add(auroraLight);
const violetLight = new THREE.DirectionalLight(0xa880ff, 0.14); violetLight.position.set(-200, 160, -120); scene.add(violetLight);

/* ═══════════════════════════ 13. Colour grade (before tone mapping) ═══════════════════════════ */
if (w.composer) {
  const grade = new ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`uniform sampler2D tDiffuse; varying vec2 vUv;
      void main() {
        vec4 c = texture2D(tDiffuse, vUv);
        vec3 col = c.rgb;
        float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(vec3(l), col, 1.1);                                        // a touch more saturation
        col += vec3(0.0, 0.004, 0.010) * (1.0 - smoothstep(0.0, 0.2, l));    // teal-blue lift in the blacks
        col *= vec3(0.98, 1.0, 1.03);
        vec2 d = vUv - 0.5; col *= 1.0 - dot(d, d) * 0.3;
        gl_FragColor = vec4(max(col, vec3(0.0)), c.a);
      }`,
  });
  w.composer.insertPass(grade, Math.max(0, w.composer.passes.length - 1));
}

/* ═══════════════════════════ 14. Per-frame ═══════════════════════════ */
addEventListener('resize', () => { const [a, b] = rtSize(); water.getRenderTarget().setSize(a, b); updatePx(); });
let toldWater = false, toldFloe = false, waveToastT = -99;
w.onUpdate((dt, t) => {
  uTime.value = t;
  water.material.uniforms.uTime.value = t;
  updateBergs(t);
  updateBrash(t);
  updateSeals(dt, t);
  horizonGlow.position.set(camera.position.x, 0, camera.position.z);
  auroraLight.intensity = 0.32 + 0.1 * Math.sin(t * 0.37) + 0.05 * Math.sin(t * 1.13);
  const p = w.player.position;
  if (!toldWater && w.player.inWater) { toldWater = true; w.toast('好冰！這裡的水只有幾度', 2600); }
  if (p.z > shoreO(p.x) + 3.6 && t - waveToastT > 8) { waveToastT = t; w.toast('小心瘋狗浪！別再靠近海了', 2600); }
  if (!toldFloe && w.player.onGround && p.y > 0.12) {
    for (const b of bergs) {
      if (b.kind === 'floe' && b.col && Math.hypot(p.x - b.col.x, p.z - b.col.z) < b.col.r && p.y > b.col.top - 0.1) { toldFloe = true; w.toast('你站上浮冰了！小心腳滑', 2600); break; }
    }
  }
});

w.start();
</script>
