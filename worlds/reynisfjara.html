<script type="module">
/*
 * ── REYNISFJARA · 黑沙灘 ────────────────────────────────────────────────────
 * Overcast, moody south-coast beach. Layout (Y up, spawn camera looks toward −Z):
 *   ocean on the right (+X), shoreline x ≈ shoreX(z); black sand beach in the middle;
 *   a wall of hexagonal basalt columns on the left (front line x = −12, z −46…22)
 *   with the climbable column "staircase" at z ≈ 2.5 and the sea cave Hálsanefshellir
 *   at z ≈ −22; the Reynisfjall headland curves out ahead and the Reynisdrangar sea
 *   stacks rise from the sea just past its tip (x ≈ 36…61, z ≈ −103…−146).
 * Ground = H(x,z) only. The surf zone (waves, swash, foam, wet sand) is driven by the
 * same analytic functions in JS and GLSL (GEO_GLSL) so the player, sound and visuals agree.
 * Sneaker waves: every ~45–70 s (first at 26 s, or press B) a big swell runs ~15 m up the beach.
 */
import * as THREE from 'three';
import { createWorld, helpers } from './engine.js';
const { fbm, noise2D, smoothstep, lerp, clamp, rand, addRim, softTexture } = helpers;

/* ═════════════════════════ 1. layout (shared by JS + GLSL) ═════════════════════════ */
const FOG = 0xa9b3ba;                                   // overcast haze = sky horizon
const SUN_DIR = [0.42, 0.33, -0.84];                    // low sun behind the sea stacks (front-right)
const SPAWN = { x: -1, z: 15, yaw: Math.PI - 0.12 };
const FRONT = -12;                                      // front line of the basalt wall
const ZONE = { cx: -14.5, cz: -12, w: 25, d: 68 };      // column block x −27…−2, z −46…22
const PYR = { x: -14.5, z: 2.5, top: 6.2 };             // the column staircase
const CAVE = { z: -22, hw: 5.6, depth: 11, h: 9.5 };    // Hálsanefshellir
const SIGN = { x: -5.5, z: -10.5 };
const SN_L = 15.5;                                      // sneaker-wave run-up (m up the beach)
const WK = (2 * Math.PI) / 22, WW = (2 * Math.PI) / 8, UB = 4;   // swell: λ 22 m, T 8 s, breaks 4 m out

const shoreX = (z) => 6 + 1.5 * Math.sin(z * 0.045 + 0.6) + 0.8 * Math.sin(z * 0.11 + 2.0) + 24 * Math.exp(-(((z + 98) / 24) ** 2));
const sandH = (u) => (u < 0 ? 1.4 * (1 - Math.exp(u / 9)) : -4 * (1 - Math.exp(-u / 14)));
const inZone = (z) => smoothstep(-50, -42, z) * (1 - smoothstep(18, 26, z));
const cliffFront = (z) => -12.5 + Math.sin(z * 0.06 + 1.0) + 44 * Math.exp(-(((z + 95) / 26) ** 2)) - 13 * inZone(z) - 55 * smoothstep(35, 120, z);
const wPhase = (z) => z * 0.06 + 1.2 * Math.sin(z * 0.021);
const runupL = (n) => 4.6 + 1.6 * Math.sin(n * 1.7 + 0.3) + 0.9 * Math.sin(n * 0.63 + 1.3);
const breakCycle = (z, t) => (WK * UB + WW * t + wPhase(z) - Math.PI / 2) / (2 * Math.PI);  // integer = crest at the break point
/** Normal swash front (u coordinate; negative = up the beach). Mirrors GLSL swashFront. */
function swashFront(z, t) {
  const c = breakCycle(z, t) - 0.18, n = Math.floor(c), q = c - n, L = runupL(n);
  if (q < 0.38) { const k = q / 0.38; return { f: lerp(0.8, -L, 1 - (1 - k) * (1 - k)), q }; }
  const k = (q - 0.38) / 0.62;
  return { f: lerp(-L, 0.8, k * k), q };
}

/** THE ground: sand beach + cliff/mountain. Terrain mesh, columns and player all use it. */
function H(x, z) {
  const u = x - shoreX(z);
  let h = sandH(u);
  if (u < -14) h += (fbm(x * 0.045, z * 0.045, 3) * 0.32 + 0.12) * smoothstep(-14, -26, u);   // dry dunes
  const d = cliffFront(z) - x;
  if (d > -0.6) {
    const low = 1 - 0.8 * smoothstep(30, 105, z);
    const top = (25 + 7 * fbm(z * 0.035, 3.7, 3)) * low;
    let m = top * smoothstep(-0.6, 5.5, d);                                              // cliff face
    m += smoothstep(4, 48, d) * (46 + 22 * fbm(x * 0.012, z * 0.012, 4)) * low;          // Reynisfjall plateau
    m += fbm(x * 0.13, z * 0.13, 3) * 2.4 * smoothstep(0, 4, d);                         // rugged rock
    h += Math.max(0, m);
  }
  if (z > 85) h = lerp(h, -0.4, smoothstep(85, 108, z));                                // fade into the far plain
  return h;
}

const h2 = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
/** Basalt wall: short fringe rows in front, then a sheer 12–23 m wall of columns. */
function wallRel(x, z) {
  const e = FRONT - x;
  if (e < -0.6) return 0;
  const r = h2(x, z);
  if (e < 0.6) return 0.35 + r * 1.1;
  if (e < 1.7) return 1.5 + r * 1.4;
  const top = 16.5 + 4.5 * noise2D(z * 0.09, 1.3) + 2.2 * noise2D(z * 0.31, 7.7) + 1.4 * noise2D(x * 0.45, z * 0.45);
  return top * (0.72 + 0.28 * smoothstep(1.7, 8, e)) + (r - 0.5) * 1.2;
}
/** Stepped "organ pipe" pyramid, quantised to 0.42 m so it is a walk/jump staircase. */
function pyrRel(x, z) {
  const dz = Math.abs(z - PYR.z);
  if (x > -2.2 || dz > 10) return 0;
  let h = PYR.top - Math.max(0, x - PYR.x) * 0.55 - dz * 0.5 + noise2D(x * 0.5, z * 0.5) * 0.3;
  if (h < 0.3) return 0;
  h = Math.round(h / 0.42) * 0.42 + (h2(z, x) - 0.5) * 0.12;
  return Math.max(0.32, h);
}
/** Arch height of the sea cave at (x,z) (0 = not inside the cave footprint). */
function caveArch(x, z) {
  const e = FRONT - x, l = Math.abs(z - CAVE.z) / CAVE.hw;
  if (e < -0.7 || e > CAVE.depth || l >= 1) return 0;
  return CAVE.h * Math.sqrt(1 - l * l) * (1 - 0.45 * (Math.max(0, e) / CAVE.depth) ** 2);
}

/* GLSL twin of the functions above (keep in sync!) */
const GEO_GLSL = /* glsl */`
float sstep(float a, float b, float x){ float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
float gss(float x){ return exp(-x * x); }
float shoreX(float z){ return 6.0 + 1.5 * sin(z * 0.045 + 0.6) + 0.8 * sin(z * 0.11 + 2.0) + 24.0 * gss((z + 98.0) / 24.0); }
float sandH(float u){ return u < 0.0 ? 1.4 * (1.0 - exp(u / 9.0)) : -4.0 * (1.0 - exp(-u / 14.0)); }
float cliffFront(float z){
  float inZ = sstep(-50.0, -42.0, z) * (1.0 - sstep(18.0, 26.0, z));
  return -12.5 + sin(z * 0.06 + 1.0) + 44.0 * gss((z + 95.0) / 26.0) - 13.0 * inZ - 55.0 * sstep(35.0, 120.0, z);
}
const float WK = ${WK.toFixed(6)};
const float WW = ${WW.toFixed(6)};
const float UB = ${UB.toFixed(1)};
float wPhase(float z){ return z * 0.06 + 1.2 * sin(z * 0.021); }
float runupL(float n){ return 4.6 + 1.6 * sin(n * 1.7 + 0.3) + 0.9 * sin(n * 0.63 + 1.3); }
float swashFront(float z, float t, out float q, out float n){
  float c = (WK * UB + WW * t + wPhase(z) - 1.5707963) / 6.2831853 - 0.18;
  n = floor(c); q = c - n;
  float L = runupL(n);
  if (q < 0.38) { float k = q / 0.38; k = 1.0 - (1.0 - k) * (1.0 - k); return mix(0.8, -L, k); }
  float k2 = (q - 0.38) / 0.62;
  return mix(-L, 0.8, k2 * k2);
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), f.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), f.x), f.y); }
`;

/* shared uniforms for every custom shader on this page */
const SU = {
  uTime: { value: 0 },
  uSneakCrest: { value: 200 }, uSneakAmp: { value: 0 },        // big swell travelling in (u coordinate)
  uSneakFront: { value: 99 }, uSneakFoam: { value: 1 },         // sneaker swash front up the beach
  uSneakWet: { value: 99 }, uSneakWetAmt: { value: 0 },         // how far the sand got wet
};
const touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

/* ═════════════════════════ 2. world ═════════════════════════ */
const w = await createWorld({
  title: '黑沙灘',
  subtitle: 'Reynisfjara · 雷尼斯黑沙灘',
  backHref: '../index.html#worlds',
  timeOfDay: 'day',
  background: FOG,
  fog: { color: FOG, density: 0.0058 },
  sky: { top: 0x77838d, horizon: FOG, bottom: FOG, sunColor: 0xfff1de, glow: 0.75 },
  sun: { color: 0xfff1de, intensity: 1.6, dir: SUN_DIR },
  hemi: { sky: 0xc7d0d8, ground: 0x26272a, intensity: 0.55 },
  exposure: 1.2,
  spawn: SPAWN,
  boundsRadius: 50, boundsCenter: { x: -6, z: -14 },
  heightAt: H,
  water: { level: 0, slow: 0.5, maxDepth: 0.85 },
  bloom: { strength: 0.3, radius: 0.55, threshold: 0.85 },
  camera: { distance: 8.5, pitch: 0.26, lookUp: 1.9, maxDistance: 22 },
  hints: ['爬上玄武岩階梯', '走進海蝕洞抬頭看', '瘋狗浪來了往陸地跑', ...(touch ? [] : ['B 鍵召喚瘋狗浪'])],
  info: [
    { at: { x: -1.4, z: 3 }, radius: 5.5, kicker: '地質奇觀', title: '玄武岩柱 Gardar',
      text: '厚厚的熔岩慢慢冷卻、收縮，像乾掉的泥巴一樣裂成六角形，一根根排得像管風琴。這座「階梯」可以一路跳上去 —— 站高一點，瘋狗浪就追不到你。' },
    { at: { x: -12.5, z: CAVE.z }, radius: 6, kicker: '你發現了', title: '海蝕洞 Hálsanefshellir',
      text: '海浪花了上萬年，一口一口把玄武岩啃出這個洞。抬頭看：天花板是一根根倒掛的六角柱，像蜂巢一樣。漲潮時洞口會被海水淹沒。' },
    { at: { x: -3, z: -54 }, radius: 7, kicker: '冰島傳說', title: '巨魔傳說 Reynisdrangar', img: '../assets/img/reynisfjara.jpg',
      text: '傳說兩隻巨魔趁夜想把一艘三桅帆船拖上岸，卻忘了時間，第一道曙光一照，就變成海上的黑色石柱。最高的 Háidrangur 有 66 公尺。' },
    { at: { x: SIGN.x + 1.6, z: SIGN.z + 1.4 }, radius: 3.2, kicker: '安全守則', title: '瘋狗浪警示燈',
      text: '海灘入口的燈號：綠燈可以散步、黃燈別靠近水邊、紅燈封閉。瘋狗浪會毫無預警衝上沙灘幾十公尺 —— 永遠不要背對大海。' },
  ],
});
const { scene } = w;
const SUN = new THREE.Vector3(...SUN_DIR).normalize();

// overcast image-based lighting: gives the wet sand, sea and basalt a soft sky sheen
{
  const envScene = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: { uSun: { value: SUN } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: /* glsl */`uniform vec3 uSun; varying vec3 vD;
      void main(){
        vec3 d = normalize(vD); float h = d.y;
        vec3 top = vec3(0.30, 0.34, 0.38), hor = vec3(0.52, 0.56, 0.60), bot = vec3(0.035, 0.04, 0.045);
        vec3 c = h > 0.0 ? mix(hor, top, pow(clamp(h, 0.0, 1.0), 0.6)) : mix(hor * 0.45, bot, clamp(-h * 4.0, 0.0, 1.0));
        c += vec3(1.0, 0.95, 0.86) * pow(max(dot(d, uSun), 0.0), 10.0) * 0.9;
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), m));
  const pm = new THREE.PMREMGenerator(w.renderer);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  pm.dispose();
}

/* ═════════════════════════ 3. black sand + cliffs (terrain) ═════════════════════════ */
const cSand = new THREE.Color(0x46484c), cDry = new THREE.Color(0x505155), cSeaBed = new THREE.Color(0x2b2e30);
const cRock = new THREE.Color(0x2e3033), cRockL = new THREE.Color(0x48494c), cMoss = new THREE.Color(0x5a6a3c), cGrass = new THREE.Color(0x6a7a45), cCave = new THREE.Color(0x202124);
const tmpC = new THREE.Color(), rockC = new THREE.Color();
function colorFn(x, y, z, ny) {
  const u = x - shoreX(z), d = cliffFront(z) - x;
  tmpC.copy(cSand).lerp(cDry, smoothstep(-8, -22, u)).lerp(cSeaBed, smoothstep(0, 3, u));
  const ra = smoothstep(-0.8, 1.6, d);
  if (ra > 0) {
    rockC.copy(cRock).lerp(cRockL, 0.5 + 0.5 * noise2D(x * 0.21, y * 0.17 + z * 0.05));
    rockC.lerp(ny > 0.93 ? cGrass : cMoss, smoothstep(0.6, 0.86, ny) * smoothstep(5, 14, y));   // mossy ledges, green plateau
    tmpC.lerp(rockC, ra);
  }
  if (caveArch(x, z) > 0) tmpC.lerp(cCave, 0.65);
  return tmpC;
}
const terrain = helpers.createTerrain({ width: 190, depth: 330, segments: 200, center: { x: -35, z: -55 }, heightFn: H, colorFn, roughness: 0.74, noiseTint: 0.06 });
// wet/dry sand driven by the swash, grain, wind ripples and glitter
terrain.material.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, SU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 rfW;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nrfW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
varying vec3 rfW;
uniform float uTime, uSneakFront, uSneakWet, uSneakWetAmt;
${GEO_GLSL}
float rfRip(vec2 p){ return sin(dot(p, vec2(0.78, 0.62)) * 7.5 + vnoise(p * 0.6) * 5.0) + 0.35 * sin(dot(p, vec2(-0.3, 0.95)) * 13.0 + vnoise(p * 1.3) * 4.0); }`)
    .replace('#include <color_fragment>', `#include <color_fragment>
float rfWet = 0.0;
float rfU = rfW.x - shoreX(rfW.z);
float rfBeach = sstep(0.4, 2.2, rfW.x - cliffFront(rfW.z));
float rfDist = length(vViewPosition);
{
  if (rfU > -20.0 && rfU < 8.0) {
    float q, n;
    float f = swashFront(rfW.z, uTime, q, n);
    float Lc = runupL(n), Lp = runupL(n - 1.0);
    float curMax = q < 0.38 ? f : -Lc;
    float wCur = sstep(curMax - 0.6, curMax + 0.9, rfU) * mix(1.0, 0.72, sstep(0.38, 1.0, q));
    float wPrev = sstep(-Lp - 0.6, -Lp + 0.9, rfU) * 0.72 * (1.0 - q);
    float wBase = sstep(-3.4, -0.6, rfU) * 0.85;
    float wSn = sstep(uSneakWet - 0.6, uSneakWet + 1.4, rfU) * uSneakWetAmt;
    float front = min(f, uSneakFront);
    float cov = sstep(front - 0.05, front + 0.45, rfU);
    rfWet = max(max(max(wCur, wPrev), max(wBase, wSn)), cov);
  }
  rfWet = max(rfWet, sstep(-0.3, 0.6, rfU)) * rfBeach;
  float grain = hash12(floor(rfW.xz * 31.0));
  diffuseColor.rgb *= 1.0 + (grain - 0.5) * 0.32 * (1.0 - sstep(5.0, 32.0, rfDist)) * rfBeach;
  diffuseColor.rgb *= mix(1.0, 0.48, rfWet);
}`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
roughnessFactor = mix(0.94, roughnessFactor, rfBeach);
roughnessFactor = mix(roughnessFactor, 0.06, rfWet);`)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{
  float dry = (1.0 - rfWet) * rfBeach * (1.0 - sstep(8.0, 38.0, rfDist)) * sstep(3.0, 8.0, -rfU);
  if (dry > 0.01) {
    vec2 rp = rfW.xz; float e = 0.05;
    float r0 = rfRip(rp), rx = rfRip(rp + vec2(e, 0.0)), rz = rfRip(rp + vec2(0.0, e));
    vec3 dn = vec3(-(rx - r0) / e, 0.0, -(rz - r0) / e) * 0.011 * dry;
    normal = normalize(normal + (viewMatrix * vec4(dn, 0.0)).xyz);
  }
}`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
{
  if (rfDist < 30.0 && rfBeach > 0.5) {
    vec2 gp = rfW.xz * 22.0;
    vec2 gi = floor(gp);
    float gh = hash12(gi);

  m.position.set(best.x, best.top, best.z); m.rotation.y = Math.PI / 2 + (i - 1.5) * 0.45;
  scene.add(m);

});
let puffinToast = false;
function updatePuffins(dt, t) {
  const p = w.player.position;
  for (const f of PUFF) {
    const m = f.m, ud = m.userData;
    if (f.state === 'idle') {
      f.hopT -= dt;
      if (f.hopT < 0) { f.hopT = 2.5 + Math.random() * 4; f.hop0 = t; }
      const k = (t - f.hop0) / 0.35;
      m.position.y = f.home.y + (k >= 0 && k < 1 ? Math.sin(k * Math.PI) * 0.08 : 0);
      ud.head.rotation.y = Math.sin(t * 0.9 + f.seed) * 0.7;
      ud.wings.forEach((pv, j) => { pv.rotation.z = (j ? -1 : 1) * 0.06; });
      if (Math.hypot(p.x - m.position.x, p.z - m.position.z) < 3.4 && Math.abs(p.y - m.position.y) < 3) {
        const dx = m.position.x - p.x, dz = m.position.z - p.z, dl = Math.hypot(dx, dz) || 1;
        const vx = dx / dl + 1.2, vz = dz / dl, vl = Math.hypot(vx, vz) || 1;
        f.vel.set((vx / vl) * 4.5, 3.4, (vz / vl) * 4.5);
        m.rotation.y = Math.atan2(f.vel.x, f.vel.z); m.rotation.x = 1.15;
        f.state = 'fly'; f.t = 0;
        if (!puffinToast) { puffinToast = true; w.toast('海鸚被你嚇飛了！', 2200); }
      }
    } else if (f.state === 'fly') {
      f.t += dt; f.vel.y += 1.2 * dt; f.vel.x *= 1 + 0.35 * dt; f.vel.z *= 1 + 0.35 * dt;
      m.position.addScaledVector(f.vel, dt);
      ud.wings.forEach((pv, j) => { pv.rotation.z = (j ? -1 : 1) * (0.5 + Math.sin(t * 30) * 0.9); });
      if (f.t > 5) { m.visible = false; f.state = 'gone'; f.t = 25 + Math.random() * 15; }
    } else if ((f.t -= dt) <= 0 && Math.hypot(p.x - f.home.x, p.z - f.home.z) > 12) {
      m.position.copy(f.home); m.rotation.set(0, f.yaw, 0); m.visible = true; f.state = 'idle';
    }
  }
}

/* ═════════════════════════ 11. surf sound (WebAudio, starts on first input) ═════════════════════════ */
const AU = { ctx: null, on: true };
function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ctx = new AC(); AU.ctx = ctx;
    const sr = ctx.sampleRate, len = sr * 4;
    const white = ctx.createBuffer(1, len, sr), brown = ctx.createBuffer(1, len, sr);
    const wd = white.getChannelData(0), bd = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const r = Math.random() * 2 - 1; wd[i] = r; last = (last + 0.02 * r) / 1.02; bd[i] = last * 3.5; }
    const src = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    AU.master = ctx.createGain(); AU.master.gain.value = 0; AU.master.connect(ctx.destination);
    AU.surfF = ctx.createBiquadFilter(); AU.surfF.type = 'lowpass'; AU.surfF.frequency.value = 800; AU.surfF.Q.value = 0.4;
    AU.surf = ctx.createGain(); AU.surf.gain.value = 0;
    src(white).connect(AU.surfF); AU.surfF.connect(AU.surf); AU.surf.connect(AU.master);
    const rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 380;
    AU.rumble = ctx.createGain(); AU.rumble.gain.value = 0.4;
    src(brown).connect(rf); rf.connect(AU.rumble); AU.rumble.connect(AU.master);
    AU.master.gain.setTargetAtTime(AU.on ? 0.5 : 0, ctx.currentTime, 1.2);
  } catch (e) { AU.ctx = null; }
}
function updateAudio(t, pu, z, s) {
  if (!AU.ctx || !AU.surf) return;
  const now = AU.ctx.currentTime, c = breakCycle(z, t), qb = c - Math.floor(c);
  const crash = qb < 0.7 ? Math.exp(-qb * 5) : smoothstep(0.88, 1, qb) * 0.4;
  const hiss = qb > 0.16 && qb < 0.6 ? Math.sin((Math.PI * (qb - 0.16)) / 0.44) : 0;
  const near = 1 / (1 + Math.max(0, -pu - 1) * 0.06);

  if (s >= 7.5 && s < 15) { const k = Math.exp(-Math.max(0, s - 9) * 0.6) * smoothstep(7.5, 9, s); g += 0.9 * k * near; f += 1800 * k; rum += 0.6 * k; }
  AU.surf.gain.setTargetAtTime(g, now, 0.09);
  AU.surfF.frequency.setTargetAtTime(f, now, 0.12);
  AU.rumble.gain.setTargetAtTime(rum, now, 0.3);
}
const soundBtn = document.createElement('button');
soundBtn.type = 'button'; soundBtn.className = 'w-btn glass'; soundBtn.textContent = '🔊 海浪聲';
soundBtn.setAttribute('aria-pressed', 'true');
soundBtn.addEventListener('click', () => {
  soundBtn.blur();
  AU.on = !AU.on; initAudio();
  if (AU.master) AU.master.gain.setTargetAtTime(AU.on ? 0.5 : 0, AU.ctx.currentTime, 0.3);
  soundBtn.textContent = AU.on ? '🔊 海浪聲' : '🔇 靜音';
  soundBtn.setAttribute('aria-pressed', String(AU.on));
});
{
  const actions = document.querySelector('.w-actions');
  if (actions) actions.insertBefore(soundBtn, actions.querySelector('[data-act="photo"]'));
}
const unlock = () => { if (AU.on) initAudio(); };
window.addEventListener('pointerdown', unlock);
window.addEventListener('keydown', unlock);

/* ═════════════════════════ 12. sneaker waves + per-frame logic ═════════════════════════ */
const warnEl = document.querySelector('.rf-warn'), edgeEl = document.querySelector('.rf-edge');
const SN = { active: false, t0: 0, caught: false, warned: false, danger: false, burst: false, wetU: 99, wetAmt: 0 };
let nextSneak = 26, warnOn = false, warnHold = 0, seaToastT = -99;
function triggerSneak() {
  if (SN.active) return;
  Object.assign(SN, { active: true, t0: w.elapsed, caught: false, warned: false, danger: false, burst: false });
  if (SN.wetAmt < 0.05) SN.wetU = 0.8;
}
function setWarn(on) {
  if (on === warnOn) return;
  warnOn = on;
  warnEl?.classList.toggle('on', on); edgeEl?.classList.toggle('on', on);
}
window.addEventListener('keydown', (e) => { if (e.code === 'KeyB' && !e.repeat) triggerSneak(); });
const breakPrev = new Map();

w.onUpdate((dt, t) => {
  SU.uTime.value = t;
  const P = w.player, p = P.position, o = w.options;

  // ── sneaker-wave timeline (s = seconds since it was spawned far offshore) ──
  if (!SN.active && t >= nextSneak) triggerSneak();
  let s = -1, crestU = 200, amp = 0, sFront = 99, sFoam = 1;
  if (SN.active) {
    s = t - SN.t0;
    if (s < 9.8) { crestU = 75 - 71 * Math.min(1.1, s / 9); amp = smoothstep(0, 2.2, s) * (1 - smoothstep(8.6, 9.8, s)); }
    if (s >= 9 && s < 12.5) sFront = lerp(0.8, -SN_L, 1 - Math.pow(1 - (s - 9) / 3.5, 3));
    else if (s >= 12.5 && s < 13.5) sFront = -SN_L;
    else if (s >= 13.5 && s < 19.5) sFront = lerp(-SN_L, 0.8, Math.pow((s - 13.5) / 6, 2));
    sFoam = s < 12.5 ? 1 : 1 - 0.75 * smoothstep(12.5, 16, s);
    SN.wetU = Math.min(SN.wetU, sFront); SN.wetAmt = 1;
    if (!SN.burst && s >= 8.8) {               // the big one breaks: a wall of spray along the beach
      SN.burst = true;
      for (let k = 0; k < 26; k++) { const z = p.z - 32 + k * 2.5 + Math.random(); emit(shoreX(z) + 3 + Math.random() * 3, 0.4, z, 9, { up: 5, upVar: 5, out: [-2.5, 0], spread: 2, size: 0.8, dur: 2.2 }); }
    }
    if (s >= 19.5) {
      SN.active = false; nextSneak = t + 45 + Math.random() * 25;

    }

  SU.uSneakCrest.value = crestU; SU.uSneakAmp.value = amp; SU.uSneakFront.value = sFront; SU.uSneakFoam.value = sFoam;
  SU.uSneakWet.value = SN.wetU; SU.uSneakWetAmt.value = SN.wetAmt;

  if (pu > 2.6) {                                // the North Atlantic is no place to swim

    if (t - seaToastT > 7) { seaToastT = t; w.toast('再往前太危險了！北大西洋的浪很兇 🌊', 2600); }
  }
  const sw = swashFront(p.z, t), front = Math.min(sw.f, sFront);

  o.water.level = covered ? Math.max(0, sand + 0.16) : 0;   // engine: wading slow-down + ripples + arm pose
  if (SN.active && s >= 9 && s < 19.5 && onSand && pu > sFront + 0.1 && pu < -0.5) {
    if (!SN.caught) { SN.caught = true; emit(p.x, sand + 0.2, p.z, 40, { up: 3.5, upVar: 3, out: [0, 0], spread: 1.2, size: 0.5, dur: 1.2 }); w.toast('哇！被浪打到了，快跑！', 2000); }
    p.x += (s < 13.5 ? -1.6 : 1.0) * dt;          // pushed up the beach, then dragged back
  }
  const danger = SN.active && s > 0.6 && s < 15 && pu > -17.5 && p.y - sand < 1.2;
  if (danger) { SN.danger = true; warnHold = t + 0.8; }
  setWarn(danger || t < warnHold);

  // ── a puff of spray whenever a wave breaks near the player ──
  for (let k = -8; k <= 8; k++) {

    if (prev !== undefined && prev > 0.85 && qb < 0.15) emit(shoreX(z) + UB - 0.3, 0.3, z + (Math.random() - 0.5) * 2, 4, { up: 2.5, upVar: 2, out: [-1.2, 0], spread: 2, size: 0.5, dur: 1.4 });
    breakPrev.set(z, qb);

  clouds.position.copy(w.camera.position);

});
