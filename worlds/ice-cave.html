<script type="module">
/*
 * 藍冰洞 Crystal Ice Cave — a winding tunnel of glacial ice inside Breiðamerkurjökull.
 * Everything (arch, floor, clamps, camera collision, icicles, drips) is driven by ONE centre-line
 * curve + a cross-section profile per sample, so walls, floor and physics always agree.
 */
import * as THREE from 'three';
import { createWorld, helpers } from './engine.js';
const { noise2D, fbm, smoothstep, lerp, clamp, rand } = helpers;

/* ═════════════════════ 1. Cave layout (pure data, no rendering) ═════════════════════ */
const CTRL = [[-5, -66], [-9, -52], [-6, -38], [1, -27], [6, -15], [4, -2], [-1, 10], [-3, 23], [0, 36], [2, 48]];
const curve = new THREE.CatmullRomCurve3(CTRL.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
const LEN = curve.getLength();
const NS = Math.round(LEN / 0.4), DS = LEN / NS;
const PX = new Float32Array(NS + 1), PZ = new Float32Array(NS + 1), TX = new Float32Array(NS + 1), TZ = new Float32Array(NS + 1);
const NX = new Float32Array(NS + 1), NZ = new Float32Array(NS + 1);
{
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  for (let i = 0; i <= NS; i++) {
    curve.getPointAt(i / NS, p); curve.getTangentAt(i / NS, t);
    const l = Math.hypot(t.x, t.z) || 1;
    PX[i] = p.x; PZ[i] = p.z; TX[i] = t.x / l; TZ[i] = t.z / l; NX[i] = -TZ[i]; NZ[i] = TX[i];
  }
}
const S_MOUTH = LEN - 11;            // the arch opens to daylight here
const S_MOULIN = 31;                 // vertical shaft with a skylight
const S_WALK0 = 13, S_WALK1 = S_MOUTH - 1.3;
const S_SPAWN = S_MOUTH - 12.5;
const WATER = -0.04;                 // meltwater puddle surface
const RH = 1.9;                      // moulin hole radius
const idxAt = (s) => clamp(Math.round(s / DS), 0, NS);
function pathPos(s, u = 0, out = {}) {
  const f = clamp(s / DS, 0, NS), i = Math.min(NS - 1, Math.floor(f)), t = f - i;
  out.x = lerp(PX[i], PX[i + 1], t) + lerp(NX[i], NX[i + 1], t) * u;
  out.z = lerp(PZ[i], PZ[i + 1], t) + lerp(NZ[i], NZ[i + 1], t) * u;
  return out;
}
const MOU = pathPos(S_MOULIN, 0.6);

// cross-section profile per sample: half-width rx, height ry, floor base, ellipse centre offset
const RX = new Float32Array(NS + 1), RY = new Float32Array(NS + 1), BASE = new Float32Array(NS + 1), HOFF = new Float32Array(NS + 1);
for (let i = 0; i <= NS; i++) {
  const s = i * DS;
  let rx = 5.3 + 1.0 * Math.sin(s * 0.083 + 0.6) + 0.7 * noise2D(s * 0.045, 3.1);
  let ry = 4.9 + 0.9 * Math.sin(s * 0.061 + 2.0) + 0.8 * noise2D(s * 0.04, 7.7);
  const mouth = smoothstep(S_MOUTH - 10, S_MOUTH, s);
  rx += 1.8 * mouth; ry += 1.3 * mouth;
  const ch = Math.exp(-(((s - S_MOULIN) / 7.5) ** 2));      // the moulin chamber
  rx += 2.6 * ch; ry += 2.4 * ch;

}
const SEC = { rx: 0, ry: 0, base: 0, hOff: 0 };
function secAt(s) {
  const f = clamp(s / DS, 0, NS), i = Math.min(NS - 1, Math.floor(f)), t = f - i;
  SEC.rx = lerp(RX[i], RX[i + 1], t); SEC.ry = lerp(RY[i], RY[i + 1], t);
  SEC.base = lerp(BASE[i], BASE[i + 1], t); SEC.hOff = lerp(HOFF[i], HOFF[i + 1], t);
  return SEC;
}

const PUDDLES = [
  { s: 22, u: -1.2, r: 1.9, depth: 0.3 },
  { s: 39, u: 2.3, r: 2.6, depth: 0.34 },
  { s: 61, u: 1.0, r: 2.2, depth: 0.3 },
  { s: 80, u: -1.6, r: 1.7, depth: 0.28 },
].map((p) => Object.assign(p, pathPos(p.s, p.u)));

/** Ground height in cave coordinates (s along the path, u lateral) — the floor mesh uses the same fn. */
function floorAt(s, u, x, z) {
  const S = secAt(s);

  const a = Math.abs(u) / Math.max(S.rx, 0.3), k = Math.min(1, S.ry / 4);
  y += k * (0.8 * Math.pow(smoothstep(0.5, 1.05, a), 1.6) + 0.9 * Math.max(0, a - 1.0));   // icy banks
  y += 0.5 * Math.exp(-((x - MOU.x) ** 2 + (z - MOU.z) ** 2) / 5.5);                        // snow cone under the moulin
  for (let i = 0; i < PUDDLES.length; i++) {
    const p = PUDDLES[i], d2 = (x - p.x) ** 2 + (z - p.z) ** 2;
    if (d2 < p.r * p.r * 1.8) y = Math.min(y, WATER - p.depth + (p.depth + 0.12) * smoothstep(p.r * 0.3, p.r * 1.2, Math.sqrt(d2)));

}

/** Nearest point on the centre line → {s, u, n, t}. Brute force over ~300 segments (cheap). */
const LOC = { s: 0, u: 0, nx: 0, nz: 0, tx: 0, tz: 0 };
function locate(x, z) {
  let best = Infinity, bi = 0, bt = 0;
  for (let i = 0; i < NS; i++) {
    const ax = PX[i], az = PZ[i], dx = PX[i + 1] - ax, dz = PZ[i + 1] - az;
    let t = ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = ax + dx * t - x, ez = az + dz * t - z, d2 = ex * ex + ez * ez;
    if (d2 < best) { best = d2; bi = i; bt = t; }

  LOC.tx = lerp(TX[bi], TX[bi + 1], bt); LOC.tz = lerp(TZ[bi], TZ[bi + 1], bt);
  LOC.s = (bi + bt) * DS;

}
const heightAt = (x, z) => { const L = locate(x, z); return floorAt(L.s, L.u, x, z); };

/* ── ice arch: noise-displaced elliptical vault ── */
function n3(x, y, z) { return 0.5 * (noise2D(x + y * 0.71, z - y * 0.37) + noise2D(y * 1.13 + z * 0.29 + 11.7, x * 0.83 - 5.2)); }
function wallDisp(x, y, z, h, s) {
  let d = 0.85 * n3(x * 0.15, y * 0.15, z * 0.15) + 0.32 * n3(x * 0.42 + 9.1, y * 0.42, z * 0.42) + 0.12 * n3(x * 1.05, y * 1.05 + 3.3, z * 1.05);
  d *= 0.4 + 0.6 * smoothstep(0.1, 1.8, h);
  d *= smoothstep(RH + 0.5, RH + 3.5, Math.hypot(x - MOU.x, z - MOU.z));   // smooth rim around the skylight

}
const AV = { x: 0, y: 0, z: 0, lat: 0, h: 0 };
function archVertex(i, th) {
  const rx = Math.max(RX[i], 1e-3), ry = Math.max(RY[i], 1e-3), c = Math.cos(th), sn = Math.sin(th);
  let lat = rx * c, h = HOFF[i] + ry * sn;
  let el = c / rx, eh = sn / ry; const ln = Math.hypot(el, eh) || 1; el /= ln; eh /= ln;
  const d = wallDisp(PX[i] + NX[i] * lat, BASE[i] + h, PZ[i] + NZ[i] * lat, h, i * DS);
  lat += el * d; h += eh * d;
  AV.lat = lat; AV.h = h; AV.x = PX[i] + NX[i] * lat; AV.y = BASE[i] + h; AV.z = PZ[i] + NZ[i] * lat;

}
/** How much daylight leaks through the ice here (0 = thick, deep blue · 1 = thin, white-cyan). */
function iceGlow(s, h, ry, x, y, z) {
  let g = 0.42;
  g += 0.58 * Math.exp(-Math.max(0, S_MOUTH - s) / 8);
  g += 0.5 * Math.exp(-((x - MOU.x) ** 2 + (z - MOU.z) ** 2) / 45) * smoothstep(0.5, 4.5, h);
  g += 0.2 * smoothstep(0.4, 1.0, h / Math.max(ry * 1.19, 0.5));
  g -= 0.3 * (1 - smoothstep(0.0, 1.5, h));
  g += 0.15 * noise2D(x * 0.07 + y * 0.05, z * 0.07 - y * 0.03);
  g -= 0.22 * (1 - smoothstep(6, 26, s));

const RING = 72, TH0 = -0.36, TH1 = Math.PI + 0.36, NV = RING + 1;
const I_ARCH = Math.min(NS, Math.round((S_MOUTH + 0.4) / DS));
const PHI = new Float32Array((I_ARCH + 1) * NV), RHO = new Float32Array((I_ARCH + 1) * NV);
const LIMP = new Float32Array(I_ARCH + 1), LIMN = new Float32Array(I_ARCH + 1);
const ARCH = (() => {

    let arc = 0, pl = 0, ph = 0, lp = 99, lnn = 99;
    for (let j = 0; j <= RING; j++) {
      const v = archVertex(i, TH0 + (TH1 - TH0) * (j / RING)), k = i * NV + j;
      pos[k * 3] = v.x; pos[k * 3 + 1] = v.y; pos[k * 3 + 2] = v.z;
      if (j) arc += Math.hypot(v.lat - pl, v.h - ph);

const limAt = (s, u) => { const i = Math.min(I_ARCH, idxAt(s)); return u >= 0 ? LIMP[i] : LIMN[i]; };

/* ═════════════════════ 2. World ═════════════════════ */
const SP = pathPos(S_SPAWN, 0.4);
const MOUTH_OUT = pathPos(S_MOUTH + 4, 0);
const pin = (s, u) => { const p = pathPos(s, u); return { x: +p.x.toFixed(2), z: +p.z.toFixed(2) }; };
const FOG = 0x0a2c62;

const w = await createWorld({
  title: '藍冰洞',
  subtitle: 'Crystal Ice Cave · Breiðamerkurjökull',
  backHref: '../index.html#worlds',
  timeOfDay: 'day',
  background: FOG,
  fog: { color: FOG, near: 9, far: 100 },
  sky: false,
  exposure: 1.1,
  hemi: { sky: 0x86c8ff, ground: 0x0b1a33, intensity: 0.55 },
  sun: { color: 0xa9d6ff, intensity: 0.5, dir: [0.25, 1, 0.45] },
  shadows: false,                           // diffuse light in a cave: the traveler's contact shadow reads better
  spawn: { x: SP.x, z: SP.z, yaw: Math.atan2(MOUTH_OUT.x - SP.x, MOUTH_OUT.z - SP.z) },
  boundsRadius: 140,
  heightAt,
  water: { level: WATER, slow: 0.7, maxDepth: 0.85 },
  bloom: { strength: 0.8, radius: 0.55, threshold: 0.7 },
  camera: { distance: 6.2, minDistance: 2.6, maxDistance: 11, pitch: 0.18, fov: 55, intro: false, lookUp: 1.0 },
  player: { light: true },
  hints: ['轉身，走進冰川深處', '找到從天井灑落的陽光'],
  info: [
    { at: pin(S_MOUTH - 3.5, 0), radius: 4.6, kicker: '冰洞入口', title: '洞口',
      text: '藍冰洞是夏天的冰川融水在冰層底下沖刷出來的隧道。入冬後水流停了，冰洞才能安全進入——而且每年形狀都不一樣，今年走過的這一條，明年夏天就會融化消失。' },
    { at: pin(S_MOUTH - 31, 1.0), radius: 4.2, kicker: '冰川小知識', title: '為什麼是藍色？', img: '../assets/img/crystal-ice-cave.jpg',
      text: '冰川冰被上百公尺的積雪壓了好幾百年，氣泡幾乎都被擠光，變得極度緻密。光線穿過厚冰時，紅光和黃光被吸收，只有藍光走得最遠——所以冰越厚、越純，就越藍。' },
    { at: pin(50, -(LIMN[idxAt(50)] - 1.2)), radius: 4.2, kicker: '冰川小知識', title: '冰的年齡',
      text: '你身邊的冰可能已經上千歲了。牆上一條條黑色紋路是火山灰：每次火山爆發落在冰川上的灰，被新雪掩埋、壓實，像樹的年輪一樣，記錄著冰島的火山歷史。' },
    { at: { x: +MOU.x.toFixed(2), z: +MOU.z.toFixed(2) }, radius: 4.4, kicker: '你發現了', title: '冰川豎井',
      text: '頭頂這個垂直的洞叫作 moulin，是夏天融水從冰川表面一路往下鑽出的豎井。到了冬天，它變成一扇天窗，讓陽光和細雪灑進冰洞裡。' },

const { scene, renderer, camera } = w;

/* ═════════════════════ 3. Procedural textures (no image downloads) ═════════════════════ */
function dataTex(data, size) {

}
function normalFromHeight(H, size, k) {

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

/** Melt scallops: tileable Voronoi dishes (height → normal map + "thin ice" mask). */

  const wrap = (i) => ((i % cells) + cells) % cells;

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

    let d1 = 9;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const q = pts[wrap(cj + oy) * cells + wrap(ci + ox)];

/** Volcanic gravel: tileable pebbles (albedo multiplier + normal map). */
function makeGravel(size = 256) {
  const r = rand(9), H = new Float32Array(size * size), C = new Float32Array(size * size).fill(0.5);
  for (let n = 0; n < 950; n++) {
    const cx = r() * size, cy = r() * size, rad = 1.6 + Math.pow(r(), 2.3) * 8.5, ex = 0.75 + r() * 0.6, tone = 0.3 + r() * 0.7;

const SC = makeScallops(), GR = makeGravel();

/* environment for glossy reflections: blue cave gradient + bright mouth */
{
  const T = pathPos(S_MOUTH + 1, 0), T0 = pathPos(S_MOUTH - 1, 0);
  const md = new THREE.Vector3(T.x - T0.x, 0.25, T.z - T0.z).normalize();
  const es = new THREE.Scene();

    side: THREE.BackSide, uniforms: { uM: { value: md } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 uM; varying vec3 vP;
      void main(){ vec3 d = normalize(vP);
        vec3 c = mix(vec3(0.01, 0.03, 0.08), vec3(0.05, 0.2, 0.55), smoothstep(-0.4, 0.2, d.y));
        c = mix(c, vec3(0.2, 0.55, 1.0), smoothstep(0.2, 1.0, d.y));
        c += vec3(1.6, 1.9, 2.2) * pow(max(dot(d, uM), 0.0), 10.0);
        gl_FragColor = vec4(c, 1.0); }`,
  })));

  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
}

/* ═════════════════════ 4. Materials ═════════════════════ */
const uTime = { value: 0 };
const HASH_GLSL = /* glsl */`
  float icH(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float icN(vec3 p){
    vec3 i = floor(p); vec3 f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(icH(i), icH(i + vec3(1.0, 0.0, 0.0)), f.x), mix(icH(i + vec3(0.0, 1.0, 0.0)), icH(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
               mix(mix(icH(i + vec3(0.0, 0.0, 1.0)), icH(i + vec3(1.0, 0.0, 1.0)), f.x), mix(icH(i + vec3(0.0, 1.0, 1.0)), icH(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
  }
  float icBand(float x, float w0, float w1){ return 1.0 - smoothstep(w0, w1, abs(fract(x) - 0.5)); }`;

/** Glacial ice: emissive "transmitted light" + scallops + ash layers + deep veins + glitter. */
function makeIceMaterial(hole) {
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.2, metalness: 0, normalMap: SC.normal, normalScale: new THREE.Vector2(0.9, 0.9), envMapIntensity: 0.75,
  });
  const U = {
    uTime, uScH: { value: SC.mask }, uGlowK: { value: 1.0 },
    uDeep: { value: new THREE.Color(0.003, 0.022, 0.11) }, uMid: { value: new THREE.Color(0.008, 0.16, 0.62) },
    uHigh: { value: new THREE.Color(0.2, 0.66, 1.0) }, uWhite: { value: new THREE.Color(0.85, 0.97, 1.05) },
    uHole: { value: hole ? new THREE.Vector4(hole.x, hole.z, hole.r, hole.y) : new THREE.Vector4(0, 0, -1, 0) },
  };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec2 aIce; varying vec2 vIce; varying vec3 vWPos; varying vec2 vIceUv;')
      .replace('#include <fog_vertex>', '#include <fog_vertex>\nvIce = aIce; vIceUv = uv; vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uDeep, uMid, uHigh, uWhite; uniform float uGlowK, uTime; uniform vec4 uHole; uniform sampler2D uScH;
        varying vec2 vIce; varying vec3 vWPos; varying vec2 vIceUv;
        ${HASH_GLSL}`)
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        if (uHole.z > 0.0 && vWPos.y > uHole.w && length(vWPos.xz - uHole.xy) < uHole.z) discard;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float bandC = vWPos.y * 0.62 + dot(vWPos.xz, vec2(0.085, -0.05)) + icN(vWPos * 0.09) * 1.9;
        float ashA = icBand(bandC * 0.23, 0.012, 0.06);
        ashA = max(ashA, icBand(bandC * 0.71 + 0.31, 0.005, 0.03) * 0.75);
        ashA = max(ashA, icBand(bandC * 1.93 + 0.67, 0.003, 0.018) * 0.45);
        ashA *= smoothstep(0.3, 0.6, icN(vWPos * 0.045 + 7.3));
        ashA *= 0.55 + 0.45 * icN(vWPos * vec3(1.6, 6.5, 1.6));
        ashA = clamp(ashA + vIce.y * 0.45, 0.0, 1.0);
        float scH = texture2D(uScH, vIceUv).r;
        diffuseColor.rgb = mix(vec3(0.05, 0.12, 0.21), vec3(0.02, 0.02, 0.024), ashA);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.7, ashA) + scH * 0.06;`)
      .replace('#include <emissivemap_fragment>', `{
        vec3 Vd = normalize(vWPos - cameraPosition);
        float inner = icN(vWPos * 0.5 + Vd * 0.9) * 0.6 + icN(vWPos * 0.23 + Vd * 2.4 + 3.1) * 0.4;
        float g = clamp(vIce.x + (scH - 0.5) * 0.26 + (inner - 0.5) * 0.42, 0.0, 1.0);
        vec3 ic = mix(uDeep, uMid, smoothstep(0.0, 0.5, g));
        ic = mix(ic, uHigh, smoothstep(0.45, 0.86, g));
        ic = mix(ic, uWhite, smoothstep(0.84, 1.0, g));
        float vein = icN(vWPos * 0.42 + Vd * 1.4 + 11.0);
        ic += uHigh * (1.0 - smoothstep(0.0, 0.028, abs(vein - 0.5))) * (0.18 + 0.55 * g);
        float fr = pow(1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0), 3.0);
        ic += uHigh * fr * 0.2 * (0.4 + g);
        ic *= 1.0 - ashA * 0.93;
        vec3 gq = vWPos * 7.0; float gh = icH(floor(gq) + 0.37);
        float gd = length(fract(gq) - 0.5);
        float tw = pow(max(0.0, sin(dot(Vd, vec3(gh * 91.0, gh * 57.0, gh * 23.0)) * 4.0 + uTime * 1.7 + gh * 40.0)), 14.0);
        ic += uWhite * step(0.986, gh) * (1.0 - smoothstep(0.06, 0.17, gd)) * tw * 6.0 * (1.0 - ashA);
        totalEmissiveRadiance = ic * uGlowK;
      }`);
  };
  m.customProgramCacheKey = () => 'ice-cave-wall';
  return m;
}

function makeFloorMaterial() {
  const m = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, metalness: 0, map: GR.color, normalMap: GR.normal, normalScale: new THREE.Vector2(0.85, 0.85), envMapIntensity: 0.9,
  });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aEmis; attribute vec2 aRI; varying vec3 vEmis; varying vec2 vRI; varying vec3 vWPos;')
      .replace('#include <fog_vertex>', '#include <fog_vertex>\nvEmis = aEmis; vRI = aRI; vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; varying vec3 vEmis; varying vec2 vRI; varying vec3 vWPos;
        ${HASH_GLSL}`)
      .replace('#include <map_fragment>', `#ifdef USE_MAP
        vec4 sampledDiffuseColor = texture2D(map, vMapUv);
        diffuseColor.rgb *= mix(sampledDiffuseColor.rgb, vec3(0.85), vRI.y);
      #endif`)
      .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = vRI.x;')
      .replace('#include <normal_fragment_maps>', `#ifdef USE_NORMALMAP_TANGENTSPACE
        vec3 mapN = texture2D(normalMap, vNormalMapUv).xyz * 2.0 - 1.0;
        mapN.xy *= normalScale * (1.0 - vRI.y * 0.8);
        normal = normalize(tbn * mapN);
      #endif`)
      .replace('#include <emissivemap_fragment>', `{
        vec3 Vd = normalize(vWPos - cameraPosition);
        totalEmissiveRadiance = vEmis;
        vec3 gq = vWPos * 9.0; float gh = icH(floor(gq) + 0.71);
        float gd = length(fract(gq) - 0.5);
        float tw = pow(max(0.0, sin(dot(Vd, vec3(gh * 83.0, gh * 61.0, gh * 29.0)) * 4.0 + uTime * 1.9 + gh * 37.0)), 12.0);
        totalEmissiveRadiance += vec3(0.85, 0.95, 1.0) * step(0.982, gh) * (1.0 - smoothstep(0.08, 0.2, gd)) * tw * 5.0 * (0.25 + vRI.y);
      }`);
  };
  m.customProgramCacheKey = () => 'ice-cave-floor';
  return m;
}

/* ═════════════════════ 5. Geometry ═════════════════════ */
/** Indexed grid (rows × cols). Flips the winding if the probe normal does not point `expect`-wards. */
function gridGeometry(rows, cols, attrs, probe, expect) {
  const geo = new THREE.BufferGeometry();
  for (const [name, arr, size] of attrs) geo.setAttribute(name, new THREE.BufferAttribute(arr, size));
  const idx = [];
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1;
    idx.push(a, d, b, b, d, e);
  }
  geo.setIndex(idx); geo.computeVertexNormals();
  const n = geo.attributes.normal;
  if (n.getX(probe) * expect[0] + n.getY(probe) * expect[1] + n.getZ(probe) * expect[2] < 0) {
    for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
    geo.setIndex(idx); geo.computeVertexNormals();
  }
  geo.computeBoundingSphere();
  return geo;
}

// moulin (skylight) geometry numbers
const iM = idxAt(S_MOULIN);

  idxAt(70) * NV + (RING >> 1), [0, -1, 0]);

// moulin shaft: an inward-facing ice chimney that rises out of the hole

    const rr = (RH + 0.03) * (1 + 0.45 * f) + smoothstep(0.03, 0.4, f) * 0.45 * n3(Math.cos(a) * 1.5 + 4, y * 0.25, Math.sin(a) * 1.5);
    const o = k * cols + j;

    uv.set([(j / J) * 2.2, (y - HOLE_Y) / 4.5], o * 2);

  }
  const geo = gridGeometry(K + 1, cols, [['position', pos, 3], ['uv', uv, 2], ['aIce', ice, 2]], (K >> 1) * cols, [-1, 0, 0]);
  scene.add(new THREE.Mesh(geo, makeIceMaterial(null)));

// floor: gravel path, glossy ice banks, puddles, snow drifts at the mouth & under the skylight
{
  const FC = 30, cols = FC + 1, I_FLOOR = Math.min(NS, idxAt(S_MOUTH + 0.8)), rows = I_FLOOR + 1, n = rows * cols;
  const pos = new Float32Array(n * 3), uv = new Float32Array(n * 2), col = new Float32Array(n * 3), emis = new Float32Array(n * 3), ri = new Float32Array(n * 2);
  const cG = new THREE.Color(0x202328), cG2 = new THREE.Color(0x3a3e46), cI = new THREE.Color(0x4f97d4), cS = new THREE.Color(0xeef5ff), c = new THREE.Color();
  for (let i = 0; i < rows; i++) {
    const s = i * DS, ext = Math.max(RX[i], 0.2) + 0.9;
    for (let j = 0; j < cols; j++) {
      const u = -ext + (2 * ext * j) / FC, x = PX[i] + NX[i] * u, z = PZ[i] + NZ[i] * u, y = floorAt(s, u, x, z), o = i * cols + j;
      pos.set([x, y, z], o * 3); uv.set([u / 2.6, s / 2.6], o * 2);
      const a = Math.abs(u) / Math.max(RX[i], 0.3);
      let ice = Math.max(smoothstep(0.5, 0.95, a), smoothstep(0.12, 0.42, fbm(x * 0.11 + 3, z * 0.11, 3)));
      const dm2 = (x - MOU.x) ** 2 + (z - MOU.z) ** 2;
      const snow = Math.max(smoothstep(S_MOUTH - 8, S_MOUTH, s) * (0.65 + 0.35 * noise2D(x * 0.4, z * 0.4)), Math.exp(-dm2 / 7));
      let wet = 0;

      c.copy(cG).lerp(cG2, 0.5 + 0.5 * noise2D(x * 0.5, z * 0.5)).lerp(cI, ice).lerp(cS, snow);
      col.set([c.r, c.g, c.b], o * 3);
      const light = 0.12 + 1.0 * Math.exp(-Math.max(0, S_MOUTH - s) / 5.5) + 0.85 * Math.exp(-dm2 / 12);

}

// meltwater puddles (engine water shader; the floor dips below WATER there)

/* ═════════════════════ 6. Daylight beyond the mouth ═════════════════════ */
const iMo = Math.min(NS, idxAt(S_MOUTH + 0.8));
const MO = { x: PX[iMo], z: PZ[iMo], tx: TX[iMo], tz: TZ[iMo], nx: NX[iMo], nz: NZ[iMo], y: floorAt(S_MOUTH + 0.8, 0, PX[iMo], PZ[iMo]) };
{
  // glacier forefield: bright snow plane
  const A = 46, B = 24, cols = A + 1, rows = B + 1, n = cols * rows, pos = new Float32Array(n * 3);
  for (let b = 0; b < rows; b++) for (let a = 0; a < cols; a++) {
    const la = (a / A - 0.5) * 90, lb = -0.4 + Math.pow(b / B, 1.6) * 50, x = MO.x + MO.tx * lb + MO.nx * la, z = MO.z + MO.tz * lb + MO.nz * la;
    const y = MO.y - 0.03 + 0.05 * Math.max(0, lb - 2) + smoothstep(1, 10, lb) * (0.35 * fbm(x * 0.05, z * 0.05, 3) + 0.004 * la * la * 0.1);
    pos.set([x, y, z], (b * cols + a) * 3);

  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xf2f7ff, roughness: 0.95, emissive: 0xcfe6ff, emissiveIntensity: 1.25, envMapIntensity: 0.3, fog: false })));

  // daylight dome (only ever seen through the mouth): white snowfield, distant peaks, pale sky
  const dome = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, fog: false, depthWrite: false,
    uniforms: { uSun: { value: new THREE.Vector3(MO.tx * 0.6 - MO.nx * 0.5, 0.35, MO.tz * 0.6 - MO.nz * 0.5).normalize() } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: /* glsl */`uniform vec3 uSun; varying vec3 vD;

    vertexShader: 'varying vec2 vUv; varying vec3 vW; void main(){ vUv = uv; vec4 w4 = modelMatrix * vec4(position, 1.0); vW = w4.xyz; gl_Position = projectionMatrix * viewMatrix * w4; }',
    fragmentShader: /* glsl */`uniform float uK; uniform vec3 uColor; varying vec2 vUv; varying vec3 vW;
      void main(){
        float r = length((vUv - vec2(0.5, 0.42)) * vec2(2.0, 2.1));

    m.lookAt(p.x + TX[i], m.position.y, p.z + TZ[i]);
    m.renderOrder = 9; scene.add(m);
  });
}

{

/* ═════════════════════ 8. Icicles, drips, rocks, ice blocks ═════════════════════ */
const R = rand(77);
const ICICLES = [];
function addIcicle(i, th, len, rad, force = false) {
  i = clamp(i, 1, I_ARCH - 1);
  const v = archVertex(i, th), x = v.x, y = v.y + 0.12, z = v.z;
  if (Math.hypot(x - MOU.x, z - MOU.z) < RH + 0.6) return null;                          // nothing hangs in the skylight
  const s = i * DS, fl = floorAt(s, v.lat, x, z);
  const walk = Math.abs(v.lat) < limAt(s, v.lat) + 0.8 && s < S_WALK1 + 0.5;
  if (walk && !force) len = Math.min(len, y - fl - 2.9);                                  // keep heads (and the camera) clear
  if (len < 0.16) return null;
  const ic = { x, y, z, len, rad: rad ?? 0.05 + len * 0.075, ry: R() * 6.28, tx: (R() - 0.5) * 0.08, tz: (R() - 0.5) * 0.08 };
  ICICLES.push(ic);
  return ic;
}
// fringe of icicles on the mouth's lip, silhouetted against the daylight
for (let n = 0; n < 80; n++) {
  const th = 0.4 + (Math.PI - 0.8) * ((n + R() * 0.7) / 80), top = 1 - Math.abs(th - Math.PI / 2) / (Math.PI / 2);
  addIcicle(I_ARCH - 1 - Math.floor(R() * 4), th, (0.2 + R() * 0.55 + top * 0.95) * (R() < 0.15 ? 1.6 : 1), undefined, true);
}
// clusters along cracks + loners
