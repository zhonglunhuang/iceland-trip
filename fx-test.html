<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FX 特效實驗室</title>
<meta name="description" content="冰島任務 · 圖片模擬小動圖（js/fx.js）的 15 種特效測試頁">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --bg-2: #0b0b0d;
    --card: #111114;
    --text: #f5f5f7;
    --muted: #86868b;
    --line: rgba(255,255,255,.08);
    --glass: rgba(22,22,26,.62);
    --ice: #7fe3ff;
    --aurora: #6bffb8;
    --violet: #b38cff;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }

  header.hero { padding: clamp(72px, 12vw, 140px) 0 clamp(36px, 6vw, 64px); text-align: center; }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  h1 {
    margin: 14px 0 0; font-weight: 900; letter-spacing: -0.035em; line-height: 1.04;
    font-size: clamp(44px, 8vw, 96px);
  }
  .grad {
    background: linear-gradient(100deg, var(--ice), var(--aurora) 50%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lede { max-width: 660px; margin: 22px auto 0; color: var(--muted); font-size: clamp(17px, 2vw, 21px); }

  .bar {
    position: sticky; top: 14px; z-index: 10; margin: 0 auto 36px; width: fit-content; max-width: 100%;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px;
    border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  }
  .pill {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
    color: var(--text); background: rgba(255,255,255,.08); padding: 9px 16px; border-radius: 999px;
    transition: background .4s var(--ease), color .4s var(--ease), transform .4s var(--ease);
  }
  .pill:hover { background: rgba(255,255,255,.14); }
  .pill:active { transform: scale(.97); }
  .pill[aria-pressed="true"] { background: var(--text); color: #000; }
  .slider { display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; color: var(--muted); }
  .slider input { accent-color: var(--aurora); width: 120px; }
  .stat { font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); padding: 0 14px; white-space: nowrap; }
  .stat b { color: var(--aurora); font-weight: 600; }

  h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.03em; margin: 72px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 17px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px; }
  .grid.small { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }

  .card {
    position: relative; overflow: hidden; border-radius: 24px; background: var(--card);
    aspect-ratio: 4 / 3; isolation: isolate;
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -30px rgba(0,0,0,.8);
    transform: translateZ(0);
    opacity: 0; translate: 0 24px; transition: opacity 1s var(--ease), translate 1s var(--ease);
  }
  .card.in { opacity: 1; translate: 0 0; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .scrim {
    position: absolute; inset: auto 0 0 0; height: 55%; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
  }
  .card .cap { position: absolute; left: 20px; right: 20px; bottom: 18px; }
  .card .cap .t { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .card .cap .d { font-size: 14px; color: rgba(245,245,247,.72); margin-top: 2px; }
  .grid.small .card .cap .t { font-size: 17px; }
  .chip {
    position: absolute; top: 14px; left: 14px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    letter-spacing: .02em; background: rgba(20,20,24,.5); border: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  }
  .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 80px 0 60px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; opacity: 1; translate: none; } }
</style>
</head>
<body>
  <header class="hero wrap">
    <div class="eyebrow">冰島任務 · FX Lab</div>
    <h1>讓每張照片<br><span class="grad">都活起來。</span></h1>
    <p class="lede">15 種 Canvas 疊加特效，把靜態照片變成會呼吸的小動圖。離開畫面自動暫停，每張卡片每幀不到 1 毫秒。</p>
  </header>

  <main class="wrap">
    <div class="bar" role="toolbar" aria-label="特效控制">
      <button class="pill" id="tAnim" aria-pressed="true">動畫</button>
      <button class="pill" id="tKb" aria-pressed="true">Ken Burns</button>
      <label class="slider">強度 <input id="amp" type="range" min="0" max="1.6" step="0.1" value="1"></label>
      <span class="stat" id="stat">— ms · 0 / 0</span>
    </div>

    <section>
      <h2>15 種特效</h2>
      <p class="sub">每種特效搭配最能看出效果的照片。</p>
      <div class="grid" id="types"></div>
    </section>

    <section>
      <h2>全部景點</h2>
      <p class="sub" id="allSub">從 <code>data/itinerary.js</code> 讀取每個景點設定的 <code>fx</code>，壓力測試用。</p>
      <div class="grid small" id="all"></div>
    </section>
  </main>

  <footer class="wrap">js/fx.js · <code>FX.mount(el, type, { accent })</code> · 照片來源：Wikimedia Commons</footer>

  <script src="data/itinerary.js"></script>
  <script src="js/fx.js"></script>
  <script>
  (function () {
    'use strict';
    var SHOW = [
      ['waterfall', 'skogafoss', '瀑布', '水簾下墜 + 底部水霧', '#7fd6e8'],
      ['geyser', 'geysir', '間歇泉', '水泡隆起 → 噴發，約 6 秒一輪', '#7fd6e8'],
      ['aurora', 'aurora', '極光', '綠紫光幕流動（加法混合）', '#6bffb8'],
      ['steam', 'grjotagja', '蒸氣', '低空霧氣 + 緩升白煙', '#c49bff'],
      ['waves', 'hvitserkur', '浪花', '碎浪線推上岸 + 海面閃光', '#ff7eb6'],
      ['drift', 'jokulsarlon', '漂流', '冰河湖水面流光', '#4aa8ff'],
      ['ice', 'crystal-ice-cave', '冰晶', '冷光閃爍 + 滴水', '#4aa8ff'],
      ['snow', 'glacier-hike', '飄雪', '三層視差雪花', '#4aa8ff'],
      ['mist', 'vik', '霧', '緩慢飄移的霧帶', '#a8b4c4'],
      ['ripple', 'kerid', '漣漪', '湖面粼粼波光', '#f5c45e'],
      ['city', 'akureyri', '城市', '暖色燈火 + 淡淡極光', '#9ad18b'],
      ['sunset', 'fjadrargljufur', '夕陽', '暖色漏光 + 鏡頭光暈 + 浮塵', '#ff8a5c'],
      ['drive', 'keflavik', '公路', '速度線 + 路面虛線 + 掠過的光', '#7fd6e8'],
      ['flight', 'taoyuan', '飛行', '雲流 + 飛機與凝結尾', '#8ab4ff'],
      ['wind', 'dyrholaey', '風', '斜吹氣流 + 草浪光影', '#a8b4c4']
    ];

    var cards = [];      // { el, img, type, accent, inst, kb }
    var animOn = true, kbOn = true, amp = 1;

    function makeCard(parent, type, imgId, title, desc, accent) {
      var el = document.createElement('article');
      el.className = 'card';
      var img = document.createElement('img');
      img.alt = title; img.loading = 'lazy'; img.decoding = 'async';
      img.src = 'assets/img/' + imgId + '.jpg';
      var scrim = document.createElement('div'); scrim.className = 'scrim';
      var chip = document.createElement('div'); chip.className = 'chip';
      chip.innerHTML = '<i></i>' + type;
      chip.querySelector('i').style.background = accent;
      var cap = document.createElement('div'); cap.className = 'cap';
      var t = document.createElement('div'); t.className = 't'; t.textContent = title;
      var d = document.createElement('div'); d.className = 'd'; d.textContent = desc;
      cap.appendChild(t); cap.appendChild(d);
      el.appendChild(img); el.appendChild(scrim); el.appendChild(chip); el.appendChild(cap);
      parent.appendChild(el);
      var c = { el: el, img: img, type: type, accent: accent, inst: null, kb: null };
      cards.push(c);
      mountCard(c);
      return c;
    }

    function mountCard(c) {
      if (c.inst) c.inst.destroy();
      c.inst = FX.mount(c.el, c.type, { accent: c.accent, intensity: amp });
      c.inst.setActive(animOn);
      // FX.mount keeps a re-created canvas in sync with an already-drifting photo
      if (kbOn && !c.kb) c.kb = FX.kenBurns(c.img);
    }

    var typesEl = document.getElementById('types');
    SHOW.forEach(function (s) { makeCard(typesEl, s[0], s[1], s[2], s[0] + ' · ' + s[3], s[4]); });

    var allEl = document.getElementById('all');
    if (window.TRIP && TRIP.days) {
      var n = 0;
      TRIP.days.forEach(function (day) {
        (day.spots || []).forEach(function (sp) {
          n++;
          makeCard(allEl, sp.fx || 'mist', sp.id, sp.title, (day.date || '') + ' · ' + (sp.en || '') + ' · ' + (sp.fx || 'mist'), day.accent || '#7fd6e8');
        });
      });
      document.getElementById('allSub').innerHTML = '從 <code>data/itinerary.js</code> 讀取 ' + n + ' 個景點各自設定的 <code>fx</code>，同時也是效能壓力測試（離開畫面的卡片會自動暫停）。';
    }

    // reveal-on-scroll
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -8% 0px' });
      cards.forEach(function (c) { io.observe(c.el); });
    } else cards.forEach(function (c) { c.el.classList.add('in'); });

    // controls
    var tAnim = document.getElementById('tAnim'), tKb = document.getElementById('tKb'), ampEl = document.getElementById('amp');
    tAnim.addEventListener('click', function () {
      animOn = !animOn; tAnim.setAttribute('aria-pressed', String(animOn));
      cards.forEach(function (c) { c.inst.setActive(animOn); });
    });
    tKb.addEventListener('click', function () {
      kbOn = !kbOn; tKb.setAttribute('aria-pressed', String(kbOn));
      cards.forEach(function (c) {
        if (kbOn) { if (!c.kb) c.kb = FX.kenBurns(c.img); }
        else if (c.kb) { c.kb.destroy(); c.kb = null; }
      });
    });
    var ampTimer = 0;
    ampEl.addEventListener('input', function () {
      amp = +ampEl.value;
      clearTimeout(ampTimer);
      ampTimer = setTimeout(function () { cards.forEach(mountCard); }, 120);
    });

    // live perf readout
    var stat = document.getElementById('stat');
    setInterval(function () {
      stat.innerHTML = '<b>' + FX.stats.ms.toFixed(2) + '</b> ms/幀 · 執行中 ' + FX.stats.active + ' / ' + FX.stats.mounted;
    }, 500);
  })();
  </script>
</body>
</html>
