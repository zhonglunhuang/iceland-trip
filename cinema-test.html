<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Cinema QA</title>
  <!--
    QA page for js/cinema.js — open via a local server:  python3 -m http.server 8000
    Query flags (combine with &):
      ?lenis=1      load Lenis smooth scroll (velocity feel with smoothing)
      ?gsap=1       load GSAP + ScrollTrigger and scrub-scale some images (transform-ownership test)
      ?reduced=1    force reducedMotion:true (cursor / velocity / magnetic / particles off, static grain)
      ?ambient=real load the real js/ambient.js instead of the stub
      ?under=1      glowMode:'under'
  -->
  <style>
    :root {
      --bg: #000; --fg: #f5f5f7; --muted: #86868b; --line: rgba(255,255,255,.12);
      --grad: linear-gradient(90deg, #7fe3ff 0%, #6bffb8 48%, #b38cff 100%);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --gutter: clamp(16px, 4.5vw, 56px);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color-scheme: dark; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }

    .hero { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 96px var(--gutter); position: relative; overflow: hidden; }
    .hero__bg { position: absolute; inset: 0; z-index: -1; }
    .hero__bg img { width: 100%; height: 100%; object-fit: cover; opacity: .55; }
    .eyebrow { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
    .hero h1 { font-size: clamp(48px, 11vw, 148px); line-height: 1; font-weight: 800; letter-spacing: -.03em; margin: 18px 0; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.lead { color: #d2d2d7; max-width: 36em; margin: 0 auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }

    .btn { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; font-weight: 600; font-size: 16px; border: 1px solid transparent; transition: background .3s, box-shadow .3s; }
    .btn:active { transform: scale(.97); }
    .btn--light { background: #f5f5f7; color: #000; }
    .btn--glass { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .pill { display: inline-flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }

    .day { position: relative; background: #000; padding: 18vh var(--gutter) 14vh; border-top: 1px solid var(--line); }
    .day__head { max-width: 1240px; margin: 0 auto 48px; }
    .day__num { font-size: clamp(64px, 12vw, 160px); line-height: .9; font-weight: 800; letter-spacing: -.04em; color: var(--accent, #fff); }
    .day__title { font-size: clamp(28px, 4vw, 48px); font-weight: 700; margin-top: 8px; }
    .day__sub { color: var(--muted); margin-top: 6px; }
    .day__chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 22px; }
    .card { border-radius: 24px; overflow: hidden; background: #0b0b0d; border: 1px solid var(--line); }
    .card__media { aspect-ratio: 4 / 3; overflow: hidden; background: #111; }
    .card__media img { width: 100%; height: 100%; object-fit: cover; }
    .card__body { padding: 18px 20px 22px; }
    .card__body h3 { font-size: 20px; }
    .card__body p { color: var(--muted); font-size: 15px; margin-top: 6px; }
    .card__body .row { justify-content: flex-start; margin-top: 14px; }
    .wide { max-width: 1240px; margin: 40px auto 0; border-radius: 28px; overflow: hidden; aspect-ratio: 21 / 9; }
    .wide img { width: 100%; height: 100%; object-fit: cover; }
    .note { max-width: 1240px; margin: 14px auto 0; color: var(--muted); font-size: 13px; }

    .end { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 0 var(--gutter); }

    /* QA panel */
    .qa { position: fixed; left: 16px; bottom: 16px; z-index: 50; width: min(320px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
      padding: 14px 16px; border-radius: 18px; background: rgba(18,18,22,.78); border: 1px solid var(--line);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); font-size: 13px; line-height: 1.45; }
    .qa h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .qa h4 button { font: inherit; color: var(--fg); background: none; border: 0; cursor: pointer; letter-spacing: 0; }
    .qa label.chk { display: inline-flex; align-items: center; gap: 6px; width: 48%; margin: 2px 0; cursor: pointer; }
    .qa .sep { height: 1px; background: var(--line); margin: 10px 0; }
    .qa .acts { display: flex; flex-wrap: wrap; gap: 6px; }
    .qa .acts button { font: inherit; font-size: 12px; color: var(--fg); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
    .qa .acts button[aria-pressed="true"] { background: rgba(127,227,255,.22); border-color: rgba(127,227,255,.5); }
    .qa input[type="text"] { width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.4); color: var(--fg); font: inherit; }
    .qa .native { margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px dashed rgba(255,255,255,.25); color: var(--muted); }
    .qa .hud { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: #d2d2d7; white-space: pre-wrap; }
    .qa.is-min > :not(h4) { display: none; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; background: var(--c, #7fe3ff); }
  </style>
</head>
<body>
  <main id="main">
    <section class="hero" aria-label="Cinema QA">
      <div class="hero__bg"><img src="assets/img/aurora.jpg" alt=""></div>
      <div>
        <p class="eyebrow">cinema.js · QA</p>
        <h1>冰島任務</h1>
        <p class="lead">往下捲動：背景光會隨每天的主題色變化，圖片會隨捲動速度微微傾斜與動態模糊，按鈕會被游標吸過去，畫面帶有底片顆粒與冰晶微塵。</p>
        <div class="row">
          <a class="btn btn--light" href="#days" data-cursor="開始任務">開始任務</a>
          <a class="btn btn--glass" href="#d5" data-cursor="進入 3D">進入 3D 體驗 →</a>
          <button class="pill" type="button">.pill 按鈕</button>
          <span class="pill" data-magnetic="0.6">[data-magnetic=0.6]</span>
        </div>
      </div>
    </section>

    <div id="days"></div>

    <section class="end" aria-label="結尾">
      <div>
        <p class="eyebrow">THE END</p>
        <h2 style="font-size:clamp(36px,7vw,88px);font-weight:800;letter-spacing:-.03em;margin:12px 0 24px">回到頂端</h2>
        <a class="btn btn--glass" href="#main" data-cursor="↑ TOP">回到頂端 ↑</a>
      </div>
    </section>
  </main>

  <aside class="qa" id="qa" data-lenis-prevent aria-label="Cinema QA panel">
    <h4>Cinema QA <button type="button" id="qaMin" aria-label="收合">–</button></h4>
    <div id="qaFeatures"></div>
    <div class="sep"></div>
    <div class="acts">
      <button type="button" id="ambBtn" aria-pressed="false">♪ Ambient</button>
      <button type="button" id="hideBtn" aria-pressed="false">hide()</button>
      <button type="button" data-accent="#ff4d6d"><span class="swatch" style="--c:#ff4d6d"></span>setAccent</button>
      <button type="button" data-accent=""><span class="swatch" style="--c:transparent;border:1px solid #888"></span>auto</button>
      <button type="button" id="destroyBtn">destroy / init</button>
    </div>
    <input type="text" placeholder="文字輸入框 → 原生游標">
    <div class="native" data-native-cursor>[data-native-cursor] 區塊：這裡保留原生游標 · <a href="#main" style="text-decoration:underline">連結</a></div>
    <div class="sep"></div>
    <div class="hud" id="hud">…</div>
  </aside>

  <script src="data/itinerary.js"></script>
  <script src="js/cinema.js"></script>
  <script>
  (function () {
    'use strict';
    var Q = new URLSearchParams(location.search);
    var TRIP = window.TRIP || { days: [] };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

    // ---------- build a long dummy page from the real itinerary ----------
    var html = TRIP.days.map(function (d, i) {
      var spots = (d.spots || []).slice(0, 6);
      var cards = spots.map(function (s, j) {
        var pic = s.img || s.id;
        var world = s.world ? '<a class="btn btn--glass" href="worlds/' + esc(s.world) + '.html" data-cursor="進入 3D">3D →</a>' : '';
        var map = s.map ? '<a class="pill" href="' + esc(s.map) + '" target="_blank" rel="noopener">地圖 ↗</a>' : '';
        var tags = (s.tags || []).map(function (t) { return '<span class="pill">' + esc(t) + '</span>'; }).join('');
        return '<article class="card">' +
          '<div class="card__media" data-cursor="走進風景"><img src="assets/img/' + esc(pic) + '.jpg" alt="' + esc(s.title) + '" loading="lazy" decoding="async" onerror="this.closest(\'.card\').remove()"></div>' +
          '<div class="card__body"><h3>' + esc(s.time ? s.time + ' · ' : '') + esc(s.title) + '</h3><p>' + esc(s.desc || s.en || '') + '</p>' +
          '<div class="row">' + world + map + tags + (j === 0 ? '<button class="btn btn--light" type="button">.btn</button>' : '') + '</div></div>' +
        '</article>';
      }).join('');
      var hero = spots[0] ? (spots[0].img || spots[0].id) : 'ring-road';
      var wideNoCinema = i === 2;
      return '<section class="day" id="' + esc(d.id) + '" data-day="' + esc(d.id) + '" style="--accent:' + esc(d.accent || '#fff') + '">' +
        '<header class="day__head"><p class="eyebrow">' + esc(d.date) + ' (' + esc(d.weekday) + ') · data-day="' + esc(d.id) + '" · accent ' + esc(d.accent) + '</p>' +
          '<div class="day__num">DAY ' + String(i).padStart(2, '0') + '</div>' +
          '<h2 class="day__title">' + esc(d.title) + '</h2><p class="day__sub">' + esc(d.subtitle || '') + '</p>' +
          '<div class="day__chips"><span class="pill">' + esc(d.stay ? '住 ' + d.stay.name : '移動日') + '</span>' + (d.sun && d.sun.set ? '<span class="pill">日落 ' + esc(d.sun.set) + '</span>' : '') + '</div>' +
        '</header>' +
        '<div class="grid">' + cards + '</div>' +
        '<div class="wide"><img src="assets/img/' + esc(hero) + '.jpg" alt="" loading="lazy"' + (wideNoCinema ? ' data-no-cinema' : '') + ' class="' + (i % 3 === 1 ? 'gsap-scrub' : '') + '"></div>' +
        (wideNoCinema ? '<p class="note">↑ 這張有 data-no-cinema（不受捲動速度特效影響）</p>' : '') +
        (i % 3 === 1 ? '<p class="note">↑ 加 ?gsap=1 時這張由 GSAP scrub scale（transform 歸 GSAP；cinema 只用 scale/filter，不搶 transform）</p>' : '') +
      '</section>';
    }).join('');
    document.getElementById('days').innerHTML = html;

    // ---------- Ambient: real module or a stub with the same surface ----------
    function stubAmbient() {
      var on = false, timer = 0;
      window.Ambient = {
        isOn: function () { return on; },
        isPlaying: function () { return on; },
        toggle: function () {
          on = !on;
          clearInterval(timer);
          if (on) timer = setInterval(function () { window.dispatchEvent(new CustomEvent('ambient:geyser')); }, 7000);
          window.dispatchEvent(new CustomEvent('ambient:change', { detail: { on: on, playing: on } }));
          return on;
        }
      };
    }
    function loadScript(src, cb) { var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = cb; document.head.appendChild(s); }

    var ambBtn = document.getElementById('ambBtn');
    ambBtn.addEventListener('click', function () {
      if (window.Ambient && window.Ambient.toggle) window.Ambient.toggle();
      setTimeout(syncAmb, 60);
    });
    function syncAmb() { var A = window.Ambient; ambBtn.setAttribute('aria-pressed', String(!!(A && (A.isPlaying ? A.isPlaying() : A.isOn && A.isOn())))); }
    window.addEventListener('ambient:change', syncAmb);

    // ---------- options from query ----------
    var opts = { progress: true };
    if (Q.get('reduced') === '1') opts.reducedMotion = true;
    if (Q.get('under') === '1') opts.glowMode = 'under';

    function start() {
      Cinema.init(opts);
      buildPanel();
    }

    var pending = 0;
    function done() { if (--pending <= 0) start(); }
    function need(src) { pending++; loadScript(src, done); }
    if (Q.get('ambient') === 'real') need('js/ambient.js'); else stubAmbient();
    if (Q.get('gsap') === '1') {
      pending++;
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js', function () {
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js', function () {
          if (window.gsap && window.ScrollTrigger) {
            gsap.registerPlugin(ScrollTrigger);
            document.querySelectorAll('img.gsap-scrub').forEach(function (img) {
              gsap.fromTo(img, { scale: 1.25 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: img, start: 'top bottom', end: 'bottom top', scrub: true } });
            });
          }
          done();
        });
      });
    }
    if (Q.get('lenis') === '1') {
      pending++;
      loadScript('https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js', function () {
        if (window.Lenis) {
          var lenis = new window.Lenis({ duration: 1.15, smoothWheel: true });
          window.lenis = lenis;
          (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
          if (window.ScrollTrigger) lenis.on('scroll', window.ScrollTrigger.update);
        }
        done();
      });
    }
    if (!pending) start();

    // ---------- QA panel ----------
    function buildPanel() {
      var box = document.getElementById('qaFeatures');
      box.innerHTML = Cinema.features.map(function (n) {
        return '<label class="chk"><input type="checkbox" data-f="' + n + '"' + (Cinema.state.options[n] ? ' checked' : '') + '> ' + n + '</label>';
      }).join('');
      syncAmb();
    }
    document.getElementById('qaFeatures').addEventListener('change', function (e) {
      var n = e.target.getAttribute('data-f');
      if (n) Cinema.toggle(n, e.target.checked);
    });
    document.getElementById('qaMin').addEventListener('click', function () {
      var qa = document.getElementById('qa');
      qa.classList.toggle('is-min');
      this.textContent = qa.classList.contains('is-min') ? '+' : '–';
    });
    var hideBtn = document.getElementById('hideBtn');
    hideBtn.addEventListener('click', function () {
      var hidden = Cinema.state.hidden;
      hidden ? Cinema.show() : Cinema.hide();
      hideBtn.setAttribute('aria-pressed', String(!hidden));
    });
    document.querySelectorAll('[data-accent]').forEach(function (b) {
      b.addEventListener('click', function () { Cinema.setAccent(b.getAttribute('data-accent') || null); });
    });
    document.getElementById('destroyBtn').addEventListener('click', function () {
      if (Cinema.state.inited) Cinema.destroy(); else { Cinema.init(opts); buildPanel(); }
    });

    var lastDay = '—';
    window.addEventListener('cinema:day', function (e) { lastDay = e.detail.id ? e.detail.id + ' ' + e.detail.color : '— (idle)'; });
    var hud = document.getElementById('hud');
    setInterval(function () {
      if (!window.Cinema) return;
      var s = Cinema.state;
      var on = Object.keys(s.features || {}).filter(function (k) { return s.features[k]; });
      hud.textContent =
        'running  ' + s.running + '   reduced ' + s.reduced + '   fine ' + s.fine + '\n' +
        'day      ' + lastDay + (s.forced ? '   forced ' + s.forced : '') + '\n' +
        'velocity ' + s.velocity.toFixed(2) + ' px/ms\n' +
        'sound    ' + s.sound + '   breath ' + s.breath.toFixed(2) + '\n' +
        'on       ' + (on.join(' ') || '—');
    }, 200);
  })();
  </script>
</body>
</html>
