<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Ambient 音效測試台 · 冰島任務</title>
<style>
  :root { --bg: #05070b; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); --fg: #f5f7fa; --dim: rgba(245,247,250,.6); --accent: #7fe3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  body { background: radial-gradient(1200px 600px at 20% -10%, rgba(107,255,184,.12), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(179,140,255,.14), transparent 60%), var(--bg); min-height: 100vh; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px 120px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 40px 0 12px; font-weight: 600; }
  p.lead { color: var(--dim); margin: 0 0 20px; }
  code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  .status { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  button.b { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; padding: 10px 12px; font: inherit; text-align: left; cursor: pointer; transition: background .2s, border-color .2s, transform .15s; }
  button.b:hover { background: rgba(255,255,255,.1); }
  button.b:active { transform: scale(.97); }
  button.b.on { border-color: var(--accent); background: rgba(127,227,255,.12); }
  button.b small { display: block; color: var(--dim); font-size: 12px; }
  button.pill { border-radius: 999px; padding: 8px 16px; text-align: center; }
  input[type=range] { width: 180px; accent-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .meter { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #6bffb8, #7fe3ff 60%, #ffd36b); transform-origin: left; transform: scaleX(0); transition: transform .1s linear; }
  .meter-wrap { width: 180px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .demo { display: none; }
  .demo.show { display: block; }
  .card { height: 70vh; margin: 16px 0; border-radius: 24px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; letter-spacing: -.01em; background: var(--card); }
  .card span { font-size: 14px; color: var(--dim); font-weight: 500; display: block; text-align: center; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Ambient 音效測試台</h1>
  <p class="lead">js/ambient.js 的手動 QA 頁：所有聲音都是 Web Audio 即時合成的，沒有任何音檔。先按右下角的玻璃按鈕（或下方「播放」）開始。</p>

  <div class="status" id="status">loading…</div>

  <h2>播放控制</h2>
  <div class="row">
    <button class="b pill" id="btnPlay">▶︎ 播放</button>
    <button class="b pill" id="btnPause">❚❚ 暫停</button>
    <label class="row" style="gap:8px;color:var(--dim)">音量 <input type="range" id="vol" min="0" max="100" value="35"> <span id="volv">0.35</span></label>
    <div class="meter-wrap" title="輸出電平"><div class="meter" id="meter"></div></div>
  </div>

  <h2>場景 · Ambient.setScene(type)</h2>
  <div class="grid" id="scenes"></div>

  <h2>音效 · Ambient.sfx(name)</h2>
  <div class="grid" id="sfx"></div>

  <h2>離線響度檢查 · Ambient._render()</h2>
  <div class="row" style="margin-bottom:10px">
    <button class="b pill" id="btnLoud">算出每個場景的 RMS / Peak（約 10 秒）</button>
  </div>
  <div id="loud"></div>

  <h2>autoBind 捲動測試</h2>
  <p class="lead">按下後會出現一串帶 <code>data-fx</code> 的卡片，並呼叫 <code>Ambient.autoBind()</code>：捲到哪張，哪張最靠近畫面中央就切換成它的場景（約 400ms 防抖）。</p>
  <button class="b pill" id="btnBind">啟用 autoBind 並顯示卡片</button>
  <div class="demo" id="demo"></div>
</main>

<script src="js/ambient.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = {
    hero: '首頁 · 深風+極光微光', waterfall: '瀑布', geyser: '間歇泉', aurora: '極光夜', steam: '溫泉蒸氣',
    waves: '黑沙灘海浪', drift: '冰河湖浮冰', ice: '藍冰洞', snow: '高地飄雪', mist: '峽谷霧氣',
    ripple: '溪流水波', city: '雷克雅維克', sunset: '夕陽', drive: '一號公路車內', flight: '機艙', wind: '曠野強風'
  };
  var SFXN = { whoosh: '轉場 whoosh', chime: 'UI chime', splash: '水花 splash', crack: '冰裂 crack', geyser: '間歇泉噴發',
    creak: '冰層 creak', bird: '鳥鳴', gull: '海鷗', bell: '遠方鐘聲', tinkle: '冰晶 tinkle', drip: '水滴', bubble: '氣泡' };

  if (!window.Ambient || !Ambient.supported) {
    $('status').textContent = '這個瀏覽器不支援 Web Audio（Ambient.supported = false）。所有 API 呼叫都會安靜地 no-op。';
  }
  Ambient.init({ button: true });

  // scene buttons
  Ambient.scenes.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'b'; b.dataset.scene = t;
    b.innerHTML = t + '<small>' + (NAMES[t] || '') + '</small>';
    b.addEventListener('click', function () { Ambient.setScene(t); if (!Ambient.isOn()) Ambient.play(); });
    $('scenes').appendChild(b);
  });
  Ambient.sfxNames.forEach(function (n) {
    var b = document.createElement('button');
    b.className = 'b'; b.innerHTML = n + '<small>' + (SFXN[n] || '') + '</small>';
    b.addEventListener('click', function () { if (!Ambient.isOn()) Ambient.play(); setTimeout(function () { Ambient.sfx(n); }, Ambient.isPlaying() ? 0 : 300); });
    $('sfx').appendChild(b);
  });

  $('btnPlay').onclick = function () { Ambient.play(); };
  $('btnPause').onclick = function () { Ambient.pause(); };
  $('vol').oninput = function () { var v = this.value / 100; $('volv').textContent = v.toFixed(2); Ambient.setVolume(v); };

  window.addEventListener('ambient:change', function (e) {
    var sc = e.detail.scene;
    Array.prototype.forEach.call(document.querySelectorAll('[data-scene]'), function (b) { b.classList.toggle('on', b.dataset.scene === sc); });
  });
  window.addEventListener('ambient:geyser', function () { $('status').style.borderColor = 'rgba(127,227,255,.8)'; setTimeout(function () { $('status').style.borderColor = ''; }, 600); });

  // status + meter
  var analyser = null, buf = null;
  setInterval(function () {
    var d = Ambient._debug();
    $('status').textContent =
      'supported ' + d.supported + '   state ' + d.state + '   on ' + d.on + '   playing ' + d.playing + '   armed ' + d.armed + '\n' +
      'scene ' + d.scene + '   wanted ' + d.wanted + '   persistent nodes ' + d.nodes + '   one-shot voices ' + d.transient + '   fading scenes ' + d.dying + '   pref ' + d.pref;
  }, 300);
  (function meter() {
    requestAnimationFrame(meter);
    var g = Ambient._graph && Ambient._graph();
    if (!g) return;
    if (!analyser) { analyser = g.ctx.createAnalyser(); analyser.fftSize = 1024; buf = new Float32Array(analyser.fftSize); g.master.connect(analyser); }
    analyser.getFloatTimeDomainData(buf);
    var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    var db = 20 * Math.log10(Math.sqrt(s / buf.length) + 1e-9);
    $('meter').style.transform = 'scaleX(' + Math.max(0, Math.min(1, (db + 60) / 50)).toFixed(3) + ')';
  })();

  // offline loudness table
  $('btnLoud').onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = '計算中…';
    var rows = [], i = 0;
    (function next() {
      if (i >= Ambient.scenes.length) {
        $('loud').innerHTML = '<table><tr><th>scene</th><th>RMS dBFS</th><th>peak</th><th>layers</th><th>nodes</th></tr>' + rows.join('') + '</table>';
        btn.disabled = false; btn.textContent = '再算一次'; return;
      }
      var t = Ambient.scenes[i++];
      Ambient._render(t, 8).then(function (b) {
        var L = b.getChannelData(0), R = b.getChannelData(1), s = 0, pk = 0, st = Math.floor(b.sampleRate);
        for (var k = st; k < L.length; k++) { s += (L[k] * L[k] + R[k] * R[k]) / 2; pk = Math.max(pk, Math.abs(L[k]), Math.abs(R[k])); }
        rows.push('<tr><td>' + t + '</td><td>' + (10 * Math.log10(s / (L.length - st))).toFixed(1) + '</td><td>' + pk.toFixed(3) + '</td><td>' + b.info.layers + '</td><td>' + b.info.nodes + '</td></tr>');
        next();
      }, function (e) { rows.push('<tr><td>' + t + '</td><td colspan="4">' + e.message + '</td></tr>'); next(); });
    })();
  };

  // autoBind demo
  $('btnBind').onclick = function () {
    var demo = $('demo');
    if (!demo.childElementCount) {
      ['hero', 'waterfall', 'geyser', 'steam', 'waves', 'drift', 'ice', 'aurora', 'city', 'drive'].forEach(function (t) {
        var c = document.createElement('div');
        c.className = 'card'; c.setAttribute('data-fx', t);
        c.innerHTML = '<div>' + (NAMES[t] || t) + '<span>data-fx="' + t + '"</span></div>';
        demo.appendChild(c);
      });
    }
    demo.classList.add('show');
    Ambient.autoBind('#demo [data-fx]');
    this.textContent = 'autoBind 已啟用 —— 往下捲';
    this.disabled = true;
  };
})();
</script>
</body>
</html>
